# ============================================================================
# Concept Alias（ゲーム内の言い回し → 正規の Concept）— RetroUX DQ3
# ============================================================================
#
# ★Concept Alias は、ゲーム内の表現揺れ・説明表現を、
#   勇者メモなどで使う**正規の Concept**へ変換するための辞書です（RX3-0440）。
#
#   例: 会話に「ひあがらせるつぼ」と出たら、品「かわきのつぼ」を聞いたことにします。
#       → 勇者メモ（hero-memo.yaml）には `聞いた: かわきのつぼ` と**正規の名前**を書きます。
#
# ★役目の分け方
#   hero-memo.yaml        勇者が何を気にするか（⚠ 会話の文の断片は書かない）
#   concept-aliases.yaml  ゲーム内の表現を、どの Concept として扱うか（★ここ）
#
# ★書き方
#   <節>:
#     <正規の名前>:              ★ROM の名前 / location-names.csv の name と同じ綴り
#       heard_aliases:
#         - <ゲーム内の表現>     ★会話にそのまま出てくる、意味のある短い表現（3 文字以上）
#
#   節は 4 つ: items（品）/ places（場所）/ monsters（敵）/ spells（呪文）
#   ⚠ 使わない節は書かなくてよい
#
# ⚠⚠ 守ること
#   ⚠ 同じ表現を 2 つの Concept に書かない（★どちらへ解くか決められない → 検査が ERROR）
#   ⚠ 会話の文を丸ごと書かない（★Concept として意味のある短い表現だけ）
#   ⚠ 正規の名前そのものは書かなくてよい（★書かなくても当たります）
#   ⚠ AI が推測で足さない（★実際の会話で確かめた表現だけ / 根拠の会話番号をコメントに）
#
# ★検査: python scripts/dq3_hero_memo_check.py（★この辞書も一緒に見ます）
# ============================================================================

schema_version: 1

items:
  かわきのつぼ:
    heard_aliases:
      - ひあがらせるつぼ        # 会話 #801（L2）
