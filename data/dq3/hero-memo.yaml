# ============================================================================
# 勇者メモ（気になること）の原本 — RetroUX DQ3
#
# ★このファイルは **人間が書く唯一の原本** です（RX3-0432）。
#   ⚠ AI が攻略内容を書き足すことはありません。
#   ⚠⚠ 第三者の攻略サイトから、文章・項目・順序・見出しを持ち込まないでください。
#
# ★書くのは 4 つだけです。
#     ① 覚えておきたいこと     memo
#     ② いつ気になり始めるか   appears_when
#     ③ いつ気にならなくなるか retires_when   ⚠⚠ 必須（省けません）
#     ④ どこの話か             about          ★**ただのコメント**（⚠ 下）
#   ★任意でもう 1 つ
#     ⑤ 何の話として気にしているか  scenario  ★`scenarios:` に定義した id（⚠ 下）
#     ⑥ 片づいたときに分かったこと  done      ★片づくと scenario の「分かったこと」に出る（⚠ 下）
#
#   ⚠ 順番・優先度・段階・親子関係は **書きません**。
#     ★「気になり始めた時刻」で自動に並びます。
#   ⚠ 内部 ID（item_id / map_id / RAM 番地 / bit）も **書きません**。
#     ★名前から自動で解決します（利用者の ROM の名前辞書 / RX3-0432）。
#
# ============================================================================
# 条件に書ける言い方は 6 つだけです
# ============================================================================
#
#   聞いた: <道具名・呪文名・敵の名前・場所の名前>  ★会話にその名前が出た
#   持った: <道具名>                   ⚠ **いま持っている**（★使う・渡すと成立しなくなる）
#                                      → ★「持っている間だけ意味がある」カードに使います
#                                      ⚠ 2026-09-28 時点で、下のカードでは**1 件も使っていません**
#   入手した: <道具名>                 ★**一度でも手に入れた**（⚠ 使っても渡しても戻らない）
#                                      ★片づく条件には基本こちらを使います（2026-09-28 / RX3-0443）
#                                      ★材料 = 持ち物で見えた品 ＋ 宝箱 ＋ しらべる ＋ 入手のできごと
#                                      ⚠ 拾ってすぐ手放した品は「持ち物」に 1 度も入りません（★実測 7 種）
#   倒した: <敵の名前>                 ★戦闘で倒した
#   行った: <場所の名前>               ★その場所に着いた
#   フラグ: <flag_id>                  ★進行フラグが立った
#
#   ⚠ 名前は ROM に入っている綴りで書きます（★かなの細かい違いは吸収します）。
#     書ける名前の数: 道具 125 / 呪文 62 / 敵 139 / 場所 20（★2026-09-26いう意味です（2026-09-27 / RX3-0432）。
#     ⚠ 攻略ヒントかどうかは見ません。★場所の名前も書けます。
#   ⚠ 辞書に無い場所は引けません。★`location-names.csv` に行を足して
#     `name` を**ゲームの本文と同じ綴り**で入れてください（⚠ 漢字ではなく かな）。
#
# ⚠⚠ `聞いた:` には**正規の名前**を書きます（2026-09-27 / RX3-0440）。
#   ⚠ 会話の文の断片（「ひあがらせるつぼ」「しんでんはネクロゴンド」など）は書きません。
#   ★ゲームが別の言い回しで言うときは、`data/dq3/concept-aliases.yaml`（Concept Alias）に
#     「言い回し → 正規の名前」を登録します。★会話にその言い回しが出たら、正規の名前を聞いたことになります。
#     例: 会話「…ひあがらせるつぼ…」 → `聞いた: かわきのつぼ` が成立
#
# ⚠⚠ `appears_when` を複数書くと「**どれか 1 つ**満たせば出る」です（★既定。何も書かなくてよい）。
#   ★`all_of: true`（全部そろって初めて出る）は **まだ効きません**（2026-09-27 実測）。
#   ⚠ 書くと読み込みで止まります。★黙って無視して「効かない値」にしないためです。
#   ★`all_of: false` は書かなくて同じです（2026-09-27 に 27 件から消しました）。
#
# ★`retires_when` も既定は「**どれか 1 つ**満たせば片づく」です。
#   ★`retires_all: true` と書くと「**全部**そろって初めて片づく」になります（★効きます）。
#
#   ⚠ flag_id は `data/dq3/story-flags.csv` の `flag_id` 列にあるものだけです
#     （★2026-09-26 時点で **8 件**）。
#
# ⚠⚠ 書けないもの（★いま RetroUX が観測できていないこと）
#
#   ⚠ 方角（「北に何かあるらしい」）      ★条件にはできません（memo 本文には書けます）
#   ⚠ 呪文を覚えた / 転職した           ★観測していません
#   ⚠ 会話でもらった品                  ★持ち物の印が立たない場合があります
#   ⚠ 人物の名前                        ★NPC の個人名データがありません
#
#   → ★これらは memo の**本文**には自由に書けます。⚠ 条件に使えないだけです。
#
# ============================================================================
# 書き方（★1 件はこの形）
# ============================================================================
#
#   - id: <英小文字と _ の短い名前>       ★重複しない安定した名前
#                                        ⚠ 頭の数字 NNN は**編集時の整理番号**です。
#                                        ⚠ 表示の順・依存関係・攻略の順を**意味しません**
#                                        （★画面の並びには使いません）
#     scenario: <scenarios の id>         ★任意。何の話として気にしているか（⚠ 下）
#     done: <片づいたときに分かったこと>   ★任意。片づくと memo の代わりにこの文が「分かったこと」に出る
#                                        ⚠ その時点で勇者が知ったことだけ（★まだ出ていないカードの話は書かない）
#     memo: |
#       <覚えておきたいこと。1〜2 文。★この文がそのまま画面に出ます>
#     appears_when:
#       - 聞いた: <名前>                 ★どれか 1 つ満たせば出ます
#     retires_when:
#       - 入手した: <名前>               ⚠⚠ 省けません（★片づく条件は基本これ）
#     retires_all: true                  ★任意。全部そろって初めて片づく（★上）
#     about: <場所の名前>                 ★任意。**補足の場所**（⚠ ナビには出ません）
#                                        ★複数書ける（`、` `・` `,` で区切る）
#                                        ⚠ 「オーブを集める」のような**話・目的は scenario へ**
#                                          （★about は地名の語彙にも使われるため / 2026-09-27）
#     why:                               ★任意。何を根拠に出しているか
#       kind: game_dialogue
#       note: <どこで見たか。⚠ 攻略サイトの URL は書きません>
#
#   ★why.kind に書けるもの
#     game_dialogue       ゲーム内の会話で見た
#     game_screen         ゲームの画面で見た（会話以外。看板・宝箱など）
#     rom_analysis        ROM 解析で分かった
#     story_flag          進行フラグの観測から
#     item                道具の解析データから
#     location            場所の解析データから
#     manual_observation  自分で遊んで気づいた
#     original_editorial  ★RetroUX 独自の言い回し（⚠ 根拠が上のどれでもない）
#
# ============================================================================
# scenario（何の話として気にしているか / 2026-09-27 / RX3-0434）
# ============================================================================
#
#   ★書き方は 2 か所だけです（⚠ 仮の例 / 2026-09-27。★下の `leads:` に本物があります）
#
#   【手順 1】 下の `scenarios:` に「話の名前」を 1 つ足す（★id は英小文字と _ / title は画面に出る名前）
#
#     scenarios:
#       orbs:                       ← id（カードから指す名前）
#         title: オーブを集める      ← 画面の見出し（★書けるのは title だけ）
#
#   【手順 2】 その話に入れたいカードに `scenario: <id>` を 1 行足す
#
#     - id: 095_muor_orb
#       scenario: orbs              ← ★これだけで「オーブを集める」の下に入る
#       memo: |
#         ムオルでオーブの手掛かりを探す
#       appears_when:
#         - all_of:                 ← ★「全部そろったら出る」（ムオル と オーブ の両方を知ったら）
#             - 聞いた: ムオル
#             - 聞いた: オーブ
#       retires_when:
#         - 聞いた: みずでっぽう
#       done: <ムオルで分かったことを 1 文>   ← ★任意。片づいたら「分かったこと」にこの文が出る
#
#   【画面ではこう見える】（★カードの条件がそろった順に、1 枚ずつ増える）
#
#     ■ オーブを集める
#        ── 気になっていること ──
#        NEW グリーンオーブを探す               ← テドンに着いた（#505）
#        NEW ムオルでオーブの手掛かりを探す      ← ムオル ＋ オーブ（#566）
#        ── 分かったこと ──
#        ✓ ...                                  ← 片づいたカードはここへ移る
#                                                  （★`done:` があればその文、無ければ memo）
#
#   ★`done:` を足していくと、片づくたびに scenario の「分かったこと」が 1 文ずつ増え、
#     ⚠ 話の中身が少しずつ解けていく見え方になります（★scenario 自体は何も覚えていません）。
#
#   ★scenario の無いカードは「ほかに気になっていること」に 1 枚ずつ並びます（★それでも動きます）。
#   ★いつ出るかは `python scripts/dq3_hero_memo_check.py --timeline` で確かめられます
#     （→ work/hero-memo-timeline-audit.md）。
#
#   ★新しい話を作るときの例（⚠ コメントのまま。使うなら # を外す）
#
#     scenarios:
#       kandata:
#         title: カンダタを追う
#     leads:
#       - id: 030_kandata1
#         scenario: kandata         ← 既存のカードに 1 行足すだけ
#
#   ★カードに `scenario: orbs` と書くと、画面で「オーブを集める」の下にまとまります。
#   ★所属するカードが 1 枚でも出たら、scenario も出ます（⚠ scenario に出る条件は書きません）。
#   ⚠ まだ出ていないカードは、題名も件数も「???」も**出ません**。
#   ⚠ 出ているカードが全部片づくと「いまは気になることはない」になります
#     （★「完了」とは出しません。後から新しいカードが出れば、また開きます）。
#
#   ⚠⚠ 所属は「**そのカードが出た瞬間、勇者が何の話として気にしているか**」で決めます。
#     ⚠ 「後から見れば○○に必要だった」という結果論では決めません。
#   ⚠ 順番・優先度・前提・次の話（order / sequence / priority / parent / prerequisite / next）は
#     **書けません**（★書くと読み込みで止まります）。
#
# ============================================================================

schema_version: 1

# ★ここに 1 件ずつ足していきます。
