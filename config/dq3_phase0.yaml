# DQ3 Phase 0 の暫定機能（RX3-0015 / 2026-08-25）
#
# ★★ これは仮設の足場です。 ★★
#   ⚠ 戦術 AI ではありません。決めたコマンドを毎ターン繰り返すだけです。
#   ★DQ3 の戦術仕様が固まったら、この節ごと捨てます。
#
# ⚠ GUI はありません（指示書 §2.2）。ここを直接書き換えてください。
# ⚠ 書き換えたら `python -m dq3.phase0.generate_lua` を実行してください。
#   （★忘れても Lua 側が指紋で気づきます）

dq3_phase0:

  # ★★ キー割り当て（依頼者 2026-08-27 / ★DQ2 に合わせる）
  #
  #   ⚠⚠ **これは「キーボードのキー」です。** ゲームの A ボタンではありません。
  #   ★NES の A ボタンは **F** に割り当ててあります
  #     （`retroux/config/default_keybindings.yaml` / 2026-08-01 実機確認）。
  #     だからキーボードの `A` は空いています。
  #
  #   ⚠⚠ **`Q` は使えません。** FCEUX の「ムービーの読み取り専用切替」に
  #     予約されています（★同上）。だから `Q` から `A` へ移しました。
  #
  #   ★空いているアルファベット: A B C E G H J K N T U V X Y
  keys:
    # ★自動戦闘の入り切り（⚠ DQ2 の `toggle_auto` と同じ）
    toggle_auto: A
    # ★ターボの入り切り（⚠ DQ2 の `toggle_turbo` と同じ）
    toggle_turbo: T
    # ★まんたん（⚠ DQ2 と同じ）
    mantan: M

  # ★★ 聞き込み・街移動・補充の Turbo（RX3-0170 / 依頼者「聞き込み・街移動 Auto Turbo化」）
  #   ★入り切りは管理画面の「聞き込みを高速実行」「街移動を高速実行」（⚠ ここではない）。
  #   ★ここは Lua 側の決めごとだけ（`dq3/phase0/town_speed.lua`）。
  #   ⚠ 戦闘の Turbo（右画面の「タ」）とは別の要求です。
  town_turbo:
    # ⚠ 画面が黙ったら（★落ちた / 閉じた）、街の作業が止まってからこの秒数で Turbo を切る
    lease_s: 30
    # ★普通の速さで進める nav の局面（依頼者 §8「問題が出る区間だけ減速」）
    #   ★普通の速さの区間は、画面が区間減速の倍率（400%）を送り直す
    #   ⚠⚠ 2026-09-11 実機（全区間 Turbo / 実効 31.6 倍）: 6 人中 3 人の会話を画面が拾えなかった
    #     （★右画面は 0.5 秒ごと = ゲームの 16 秒ごとにしか見ない。窓がその間に開いて閉じる）。
    #   → ★会話（talk）と窓を閉じる（close）の間だけ減速。★歩く・向く・待つは Turbo のまま
    slow_phases: [talk, close]
    # ★人がゲームの B（キーボードの D）を押したら止める（依頼者 §14）
    cancel_on_b: true

  auto_battle:
    # ★入り切り。⚠ 既定は false（勝手に動かさない）。実行中は A キーでも切り替わる
    enabled: false

    # パーティの位置ごとの行動。
    #
    #   primary   … ★第一優先のコマンド
    #   fallback  … ⚠ primary ができないときに代わりに出すコマンド
    #   spell     … primary/fallback が spell のときの呪文名（★画面に出るとおりに）
    #   min_mp    … ⚠ この値未満なら primary をあきらめて fallback へ
    #
    # 使えるコマンド: attack / defend / spell
    #   ⚠ item はまだ実装していません（★書くと押さずに止まります）
    #
    # ★短く書くこともできます:  p1: attack   （= primary: attack のみ）
    commands:
      p1:
        primary: attack
        fallback: attack
      p2:
        primary: attack
        # ★HP が 5 割を切ったら防御に切り替える（依頼者の案の簡易版）
        #   ⚠ 回復（ホイミ）は呪文が通らないので、いまは防御まで
        hp_below: 50
        fallback: defend
      p3:
        # ⚠⚠ 回復呪文は**対象を選べない**（Phase 0 は画面の既定をそのまま決める）。
        #   ★既定は先頭の仲間なので、いつも同じ人に飛んで**無駄打ち**になる。
        #   → 対象を選べるようになるまで、回復は指定しない。
        #
        #   ★試すなら:
        #     primary: spell
        #     spell: ホイミ
        #     min_mp: 4
        #     fallback: attack
        primary: attack
        fallback: attack
      p4:
        # ★2026-08-26: 実機で呪文が通った。⚠ 攻撃呪文なら対象は敵なので、
        #   既定（先頭の敵）をそのまま決めても**無駄にならない**。
        primary: spell
        spell: メラ          # ⚠ 画面に出るとおりに書く（★同梱していません）
        min_mp: 2            # ⚠ MP がこれ未満なら fallback へ
        fallback: attack

    # ⚠⚠ 呪文（spell）は**まだ実機で通していません**（2026-08-26 時点）。
    #
    #   ★2026-08-26: 通らなかった**原因が判明し、直しました**。
    #   呪文を決めたあと「誰に／どの敵に」を選ぶ**もう 1 段**があり、
    #   そこで対象の窓が出る前に押していたのが原因でした。
    #   （依頼者に普通に遊んでもらい、人の手順を記録して判明）
    #
    #   ⚠ ただし**直したものを実機でまだ動かしていません**。
    #   ★試すときは、下の例のコメントを外してください。
    #   ⚠ 合わなければ `target_not_shown` などで**止まります**（暴走しません）。
    #   詳しくは `docs/research/dq3-text-capture-report.md` の §13。
    #
    # ★呪文を使う例（実機で通ったら、そのまま差し替えれば動きます）
    #   p3:
    #     primary: spell
    #     spell: ホイミ        # ⚠ 画面に出るとおりに書く（★同梱していません）
    #     min_mp: 4            # ⚠ MP がこれ未満なら fallback へ
    #     fallback: attack
    #   p4:
    #     primary: spell
    #     spell: メラ
    #     min_mp: 2
    #     fallback: defend

    # ★AUTO の戦闘を**速くしてよいか**（RX3-0166 / 2026-09-11）。
    #   ⚠⚠ 以前は「A で AUTO を入れたら同時にターボ」（依頼者の案 / 2026-08-26）でした。
    #   ★いまは **既知・安全な戦闘だけ**速くします（`dq3/phase0/battle_speed.lua`）:
    #
    #     速くする    倒したことのある敵だけ ＋ 戦況が 消化戦 / 優勢 / 均衡（★死者・HP は見ない / 2026-09-13）
    #     速くしない  初見の敵 / ボス・イベント戦の候補 / 劣勢 / AI の判断が無い
    #     ★均衡は 2026-09-12 から速くする（依頼者「戦況が均衡でもターボして良い」/ RX3-0199）
    #     戻す        勝利・結果に入ったそのフレーム / 危険になった / AUTO を切った /
    #                 逃げた / セーブを読んだ（★危険化のあとは同じ戦闘で勝手に速くし直さない）
    #
    #   ★RX3-0169: A = Auto の近道（★戦闘の本体でだけ）/ T・タ = **Auto 中の速さ**
    #     （AUTO_TURBO ⇄ AUTO_NORMAL / ★均衡・初見でも人が押せば速く（2026-09-11）/ Auto OFF では何もしない）
    #   ⚠ Lua から出せるのは **normal と turbo だけ**（`docs/research/fceux-speed-control.md`）。
    #   ★戻すと普通の速さ（★管理画面の 2 倍速は画面が送り直す）。
    #   ★戦闘を目で追いたいときは false にしてください（★速くしない）。
    turbo_with_auto: true

    # ★★ 倒したことのある敵だけの戦闘は、A を押さなくても Auto に入る（2026-09-11 依頼者
    #   「勝利済のモンスターの場合は自動的にオート・ターボ戦闘に入ってほしい」）。
    #   ★条件: 敵が全員「倒したことのある種類」/ ボス・イベント戦の候補でない /
    #     窓の色がオレンジ（死者あり）でも緑（HP 1/4 未満）でもない（★RX3-0225 / ⚠ 以前は 死者なし / HP 30% 以上）
    #   ★Auto 中に窓の色がオレンジか緑になったら、Auto を切って手で戦う画面へ返す（★人が入れた Auto も / RX3-0225）
    #   ★AI の戦況が劣勢になったら、Auto も Turbo も止めて手で戦う画面へ返す（2026-09-13）。
    #     ★自動で入った Auto は、最初の作戦がもう劣勢でも返す（⚠ 人が入れた Auto は、劣勢を抜けてまた入ったとき）
    #   ★Turbo は入ったあとの判定しだい（↑ 戦況が 消化戦 / 優勢 / 均衡 なら速く）。★A でいつでも手動に戻せる
    #   ⚠ 初見の敵が 1 体でもいれば手動のまま（★人が A で決める）
    #   ★ふだんの入り切りは管理画面「倒したことのある敵とは自動で戦う」（★ここはその既定）
    auto_start_known: true

    # ★速くしてよい戦況（★AI の語: mop = 消化戦 / advantage = 優勢 / even = 均衡 / disadvantage = 劣勢）
    #   ⚠ 2026-09-13 に danger_hp（HP 30% を割ったら速くしない）を外した（依頼者「３割は廃止」/ RX3-0225）。
    #     ★死者・HP は窓の色（オレンジ・緑）で Auto ごと止まる。★劣勢に「なった」ら Auto も Turbo も止まる
    #     （⚠ 人が A / 画面で入れた Auto が、はじめから劣勢なら続ける）。⚠ AI の TUNING の danger_hp は別物
    fast:
      situations: [mop, advantage, even]

    # ★勝ったあと（RX3-0166 / 依頼者「成果・変化は人間に返す」「単純な戦闘完了はボタンを押さないでも」）:
    #   simple     ★既定。ファンファーレを普通の速さで聞かせてから、結果の文（経験値・ゴールド）も
    #              送ってフィールドまで戻す。⚠ レベルアップ・アイテムを手に入れた・いつもと違う曲が
    #              出たら、そこで AUTO を終えて人に返す
    #   hand_back  勝ったらすぐ人に返す（★結果の文は全部人が送る）
    #   advance    ⚠ 無人の実機 run だけ。何が起きても結果の文を全部送る
    #   ★画面の頼み `auto result=...` でも、その 1 回だけ切り替わる
    result: simple
    # ★ファンファーレを聞かせる間の**上限**（フレーム / 60 = 1 秒）。
    #   ★ファンファーレ（曲 $16）が鳴っている間は送らない。★実機ではゲームが自分で 79 フレーム後に
    #     場所の曲へ戻すので、そこから送り始める（⚠ 曲が戻らなくても、この上限を過ぎたら送る）
    result_wait: 150

    # ★暴走止め。コマンド待ちの画面が出ているのに、この回数だけ画面が変わらなければ止める
    stuck_frames: 600
    # 入力の間隔（フレーム）。⚠ 短すぎると取りこぼす
    press_interval: 8
    # ★呪文の一覧が出るのをこの回数だけ待つ。出なければ止める
    submenu_wait: 240

    # ★★ 戦闘が終わったあとの後始末（依頼者の指摘 / 2026-08-27）
    #   ⚠ これまでは戦闘が終わっても ON のまま、ターボのままだった。
    #
    #   ★▼（メッセージ送り）が出ていれば A で送る。
    #     ⚠ レベルアップも「けいけんち」も、**全部これで通ります**
    #     （★文字を読まなくてよい）。

    # ⚠ ▼ を送る間隔（フレーム）
    more_gap: 20
    # ★戦闘フラグが降りてから、この回数だけ様子を見て終わる
    outro_settle: 60
    # ⚠⚠ 勝利のあとの「経験値と G」の画面には **▼ が出ません**（実測）。
    #   ★画面がこの回数だけ止まっていたら A を送ります
    #   （⚠ 演出が動いている間は触りません）。
    outro_poke: 30
    # ⚠⚠ 送っても進まないなら止める（★永遠に押し続けない）。
    #   40 にしていたら、フィールドで**40 回メニューを開け閉めした**（実機）。
    outro_max_pokes: 6
    # ★★ フィールドに戻ったかを**画面**で見る（⚠ `$62` は当てにならない）。
    #   セーブステート 10 個の実測:
    #     戦闘（$62=255）  … 非 0 タイル 136 / 175 / 211 / 230 / 261
    #     フィールド        … 非 0 タイル 791 / 870 / 960
    #     ⚠⚠ 事故った例    … **$62=2 なのにフィールド**（非 0 = 867）
    #   ★これ以上なら地形が敷き詰まっている＝フィールド。押しません
    field_tiles: 500
    # ⚠ レベルアップを**記録に残す**ためだけの語（★制御には使いません）
    #   画面に出るとおりに書く（★同梱していません）。空でも動きます。
    #
    #   ⚠⚠ **濁点のある字は今は照合できません。**
    #     DQ3 は濁点を「1 行上の別タイル」で描くので、
    #     ★「レベル」は `ベ` が表に無く、そのままでは当たりません。
    #     → 空のままにして、★**最大 HP が増えたか**で見ています
    #       （⚠ 推定として記録するだけ。制御には使いません）。
    level_up_text: ""
  mantan:
    # ★M で「まんたん」（依頼者の案 / 2026-08-26）
    #   「HP をチェックして、9 割切ってたら僧侶がホイミ」
    #
    #   ⚠ 手順は実測どおり（★依頼者に普通に回復してもらった記録から）。
    #   ⚠ 想定と違う画面なら**押さずに止まります**。

    # ★★ 回復のしかた（RX3-0174 / 2026-09-11 依頼者「道具を優先するか、呪文を優先するか、道具を使わないを設定で選ばせる」）
    #   spell_first  ★既定。呪文 → 唱えられなければ（MP が足りない・回復役が倒れている）やくそう
    #   item_first   やくそう → 無くなったら呪文
    #   spell_only   道具を使わない（★以前のまんたん）
    #   ★spell_first / item_first では、毒の人に どくけしそう を使う（★HP の回復より先）
    #   ★まひ（RX3-0252）は毒より先に キアリク / まんげつそう（★どちらが先かは同じくこの設定 /
    #     spell_only でも キアリク は唱える）。⚠ まひの人は唱える人・道具の持ち主にしない
    #   ★ふだんの切り替えは右画面の「まんたん設定」（★ここはその既定）
    heal_order: spell_first
    # ⚠ 画面に出るとおりに書く（★同梱していません）
    herb: やくそう
    antidote: どくけしそう
    moon: まんげつそう

    # ★★ まんたん v1（RX3-0161 / 0163 / 0162 / 2026-09-12 依頼者「推奨順にどんどん進めて」）
    #   ★唱える人と呪文は**覚えている呪文**から選ぶ（ホイミ / ベホイミ / ベホマ / 毒にはキアリー）。
    #   ★回復役（healer）は「同じくらい良いときに優先する人」。⚠ 呪文の表が読めないときは今までどおり
    #     この人がホイミを唱える（v0）
    healer: p3
    # ⚠ v0（呪文の表が読めないとき）に唱える呪文（★画面に出るとおりに書く）
    spell: ホイミ
    # ★これを下回ったら回復する（%）
    hp_below: 90
    # ★唱えた**後**に残す MP（★依頼者の判断 2026-09-12 / 既定 0 = 使い切ってよい）
    min_mp: 0
    # 入力の間隔（フレーム）。⚠ 短すぎると取りこぼす
    press_interval: 10
    # ★窓が出るのをこの回数だけ待つ。出なければ止める
    wait: 240
    # ⚠ 1 回の「まんたん」で唱える上限（★暴走止め）
    max_casts: 12
    # ★★ まんたんの間だけターボにする（依頼者の案 / 2026-08-27）
    #   ⚠ 通常速度だと、8 回唱えるのに何十秒も待つことになる。
    #   ★終わったら**必ず**通常速度へ戻します（止まったときも）。
    #   ⚠ 音は速くなります。★気になるなら false に。
    turbo: true

    # ★★ 唱えてよい人（RX3-0214 / 2026-09-12 依頼者「対象のキャラを対象にするか否かを決めるチェックボックス」）
    #   ★ここに無い人は まんたんで呪文を唱えない（★画面のチェックで変えられる / 並びの番号 p1〜p4）。
    #   ★勇者の MP は最後の手段: 勇者は、ほかに唱えられる人が居ない時だけ唱える（⚠ ここで外せば唱えない）
    casters: [p1, p2, p3, p4]

    # ⚠ 旧: Phase 0-3 の下書き（★healer に置き換えました）
    healer_priority: [2, 3, 1, 4]
