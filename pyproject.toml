[project]
name = "retroux"
version = "1.0.3"
description = "RetroUX — modernizes the user experience of classic games without changing what made them great"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retroux", "dq2rom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
