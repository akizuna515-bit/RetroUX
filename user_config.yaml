# RetroUX 利用者設定の雛形（MVP2 Phase 1）
#
# これをリポジトリ直下に `user_config.yaml` としてコピーして使います。
# **無くても動きます**（ここに書いてある値が既定値です）。
#
# ★このファイルは「あなたの環境の話」だけを持ちます。
#   ゲームの知識（危険状態のしきい値・倒す順・呪文の指定など）は
#   retroux/plugins/dq2/config.yaml 側です。混ぜないでください。
#   あちらは実機検証の積み重ねなので、環境の都合で汚したくありません。
#
# ⚠ user_config.yaml は Git 管理外です（.gitignore）。
#   共有したい設定を書かないこと。

paths:
  rom: work/rom/DQ2_J.nes
  db: work/retroux.sqlite3
  events: work/events.jsonl
  command: work/command.json
  # ★FCEUX の Lua も同じファイルへ書きます（意図的に1本にしています）。
  log: work/retroux.log
  # Lua が書く「いまの状態」（表示用。消えてよい / MVP2 Phase 2）
  # ★events.jsonl とは別物です。あちらは「起きたこと」、これは「いまの値」。
  state: work/state.json
  # 取り込みプロセスの排他（GUI と record を同時に動かさないため）
  lock: work/event_ingestor.lock
  # セーブステートの世代バックアップの排他
  # ★2つ動くと世代が倍の速さで流れ、戻りたい世代が押し出されます
  backup_lock: work/savestate_backup.lock

logging:
  # ★★ ファイルと画面でレベルを分けます（2026-08-09）★★
  #
  #   level     … work/retroux.log に残す下限。★既定 DEBUG（全部残す）
  #   gui_level … System Log に出す下限。★既定 INFO（読める量に絞る）
  #
  # ⚠ 戦闘のターンごとの出来事と、移動の観測（新しい道／想定外の座標変化）は
  #   DEBUG です。**画面には出ませんが、ログには残ります。**
  #   ★あとから追いたいときは「📄 ログを開く」で見てください。
  # ⚠ 画面にも全部出したいなら gui_level を DEBUG にします。★戦闘1回で
  #   数十行、移動で毎秒数行になるので、読みたい行が押し流されます。
  # ★★ 出す量の段階（2026-08-13 / 製品版ログ整理 §19）★★
  #
  #   normal      … 通常利用。★静か。work/retroux.log は INFO 以上
  #   diagnostic  … 不具合調査。DEBUG 以上（状態遷移・判断確定・分岐結果）
  #
  # ⚠⚠ **Lua 側もこれを見ます。** これを入れるまで Lua の行は段階を持たず、
  #   `level: INFO` にしてもログの 63%（実測 33,578 行）が出続けていました。
  #
  # ⚠ `level` / `gui_level` は **diagnostic のときの細かい調整**です。
  #   ★通常は `mode` だけ触れば足ります。
  mode: normal

  # --- ここから下は diagnostic のときの細かい調整 --------------------
  #
  # ⚠⚠ **書くと `mode` より優先されます。** 通常は書かないでください。
  #   ★書いていない（コメントのまま）なら `mode` の値が効きます。
  #
  #   level     … work/retroux.log に残す下限
  #   gui_level … System Log に出す下限
  #
  # ⚠ 2026-08-09 の「画面には出さないがログには残る」形
  #   （level: DEBUG / gui_level: INFO）は **diagnostic の既定**です。
  #
  # level: DEBUG           # DEBUG / INFO / WARNING / ERROR
  # gui_level: INFO
  max_bytes: 10485760      # 10MB でローテーション
  backup_count: 5          # 世代数
  gui_lines: 500           # GUI の System Log が持つ行数

# --- 研究用の採取（2026-08-13 / 製品版ログ整理 §22）--------------------
#
# ★★ **通常運用では走らせません。** ★★
#   NORMAL でも DIAGNOSTIC でも OFF です（指示書 §20・§21）。
#
# ⚠ 「絵を撮るのをやめる」話ではありません。★モンスターの絵は
#   `python -m dq2rom monsters extract`（ROM から）で 82 体そろっており、
#   実機の撮影10枚と画素まで一致しています。
#   ★画面からの採取は**その確かめのため**の研究作業です。
#
# ⚠ ログの段階（logging.mode）とは**別**です。
#   ★研究は「ログを多く出す」ことではなく「別の仕事をする」ことなので、
#     第3のログレベルにすると混ざります。
research:
  capture: false

gui:
  width: 1920
  height: 1080
  interval_ms: 500         # 画面更新の間隔
  emulator_width: 1280     # ★resize_emulator: true のときだけ使います
  emulator_height: 960
  panel_width: 640         # 右端に置く RetroUX パネルの幅
  maximized: false

emulator:
  # ウィンドウを探すときのタイトルの**先頭**（前方一致）。
  # ★「含む」で探すと、フォルダ名に RetroUX を含むエクスプローラーなど
  #   関係のないウィンドウまで動かしてしまいます（実際に踏みました）。
  window_title_contains: FCEUX
  align_window: false
  # 並べる領域の左上
  align_x: 0
  align_y: 60
  # ★FCEUX の映像倍率（起動時に fceux.cfg の窓倍率へ書き込みます）。既定 2 = 2倍。
  #   新規展開の FCEUX は既定1倍なので、ここで2倍にして起動します。等倍にしたい
  #   ときは 1 にしてください。⚠ 画面が小さいときは 1 にすると 4区画が収まります。
  window_scale: 2

  # --- 並び順 ---------------------------------------------------------
  #   [Lua Script]  [ FCEUX（真ん中） ]  [RetroUX GUI]
  #
  # ★Lua Script ウィンドウは -lua 付き起動で必ず出ます。閉じるとスクリプトが
  #   止まるので消せません。放っておくとゲーム画面の上に重なるため、
  #   左に居場所を作って追い出します。
  lua_window_title: Lua Script
  lua_window_width: 420

  # ★FCEUX の大きさは変えません（既定）。
  #   1280×960 を指定しても実際には 784×731 になりました。FCEUX は自分の
  #   表示倍率に合う大きさへ丸めるためです。倍率を変えたいときは
  #   FCEUX 側の Config > Video で行ってください。
  resize_emulator: false

# --- 「保存して終了」ボタン -------------------------------------------
shutdown:
  # セーブステートの保存先スロット（1〜9）
  # ⚠ スロット0は使えません（FCEUX がハングします）
  # ⚠ **上書きされます。** 直前の内容は世代バックアップに残るので戻せます。
  save_slot: 1
  # 保存できたという返事を待つ秒数。
  # ★返事を待たずに閉じると、FCEUX が先に終わって保存されないことがあります。
  save_timeout_seconds: 5.0

# --- ゲームパッド（XBOX / XInput）------------------------------------
#
# ★RetroUX が XInput でパッドを読みます。独自機能（LB/RB/LT/RT/X/Y）は挿すだけ。
gamepad:
  # パッドを読むか。false ならキーボードのみ（環境変数 RETROUX_NO_GAMEPAD でも OFF）。
  enabled: true
  # NES 標準入力（十字/A/B/Start/Select）を RetroUX から FCEUX へ注入するか。
  # ★true（既定）… 挿すだけで移動も効く（RetroUX 経由）。
  # ⚠ false … NES 入力は送らず、**FCEUX 本体のパッド割当**に任せる（切り分け検証用）。
  #   独自機能（LB/RB/LT/RT/X/Y）は false でも従来どおり効きます。
  inject_nes_input: true
  # 切り分け用の DEBUG ログ（フォーカス・押したボタン）。既定 OFF。
  # （環境変数 RETROUX_GAMEPAD_DEBUG でも ON にできます）
  debug: false

# --- 画面に出すキャラの名前 -------------------------------------------
#
# ★**ゲーム内の名前は RAM から読めていません。**
#   置き場所は分かりました（$0113〜。逆アセンブルに `Name first half` とある）が、
#   **かなの文字コード表が未確定**なので、推測で文字を当てて出すことはしません。
#   分かるまでは、ここに書いた名前を使います。
#   書かなければ内部名（lorasia / samaltria / moonbrooke）がそのまま出ます。
names:
  lorasia: ""      # 例: あかり
  samaltria: ""    # 例: トンヌラ
  moonbrooke: ""   # 例: マリア
