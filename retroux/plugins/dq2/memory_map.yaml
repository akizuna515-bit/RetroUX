    name: 戦闘コマンド
    # 実測（work/battlemenu/p0.txt と画面）: 行数4。cursor_x は 255（1列）。
    #
    # ★★ 行1 は人によって中身が違う ★★
    #   ローレシア（MP 0/0）  : 行0 たたかう / 行1 にげる  / 行2 ぼうぎょ / 行3 どうぐ
    #   サマルトリア（MPあり）: 行0 たたかう / 行1 じゅもん / 行2 ぼうぎょ / 行3 どうぐ
    #
    #   機械的に「じゅもん=行1」とすると**ローレシアが逃げ出す**。
    #   行1 を押すのは最大MPが 0 より大きい人だけに限ること。
    #   （DQ2 ではローレシアは呪文を覚えないので、この判定で足りる）
    #
    #   ★「いま誰の番か」は addresses.battle_input_member（$00A8）で読める
    #     （2026-07-25 / O-2 解決 / work/o2/verify.txt）。
    #     最大MPは「その人が呪文を使えるか」しか教えない。
    #     「いまその人の番か」はこの添字でしか分からない。**両方を見る。**
    #
    # 行0（たたかう）は全員共通なので、そこだけを押す実装は安全。
    single_column: true
    rows:
      0: たたかう
      1: にげる/じゅもん     # ★MPの有無で変わる
      2: ぼうぎょ
      3: どうぐ

