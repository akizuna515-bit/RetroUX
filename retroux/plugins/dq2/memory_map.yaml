# DQ2 (FC) RAM マップ
#
# 対象ROM: 日本版FC「ドラゴンクエストII 悪霊の神々」 Enix EFC-D2 / HVC-UNROM
#   PRG-only CRC32:  48349B0B
#   PRG-only SHA256: B0F0CE24890DB516C01B1E748A8B4C68B38CEBC404C2BC1C24A1EF6FE02AC5CC
#
# 特定の根拠と確度は docs/memory_map.md を参照。
# このファイルが正であり、アドレスをコードへ直接書かないこと（指示書の方針）。
#
# confidence:
#   confirmed - 独立した複数の証拠で裏付け済み。実装に使ってよい
#   likely    - 統計的に強く示唆されるが独立検証が未了
#   candidate - 絞り込みの結果であり他の解釈が残る

# ★★ 設定スキーマの版（2026-08-07 / 戦闘AI再設計 Phase 10）★★
#
#   ⚠⚠ **知らない版を黙って読まない。** 将来 DQ3 などを足すとき、
#     古い形の設定をそのまま読むと「効いているつもりで効かない」
#     という、いちばん気づきにくい壊れ方になります。
#   ★形を変えたらこの数を上げ、読む側の対応も同じコミットで直します。
schema_version: 1

rom:
  title: "ドラゴンクエストII 悪霊の神々"
  region: JP
  mapper: 2
  prg_crc32: "48349B0B"
  prg_sha256: "B0F0CE24890DB516C01B1E748A8B4C68B38CEBC404C2BC1C24A1EF6FE02AC5CC"

addresses:
  # --- 戦闘状態 --------------------------------------------------------
  enemy_instance_numbers:
    addr: 0x016A
    size: 1
    confidence: confirmed
    description: |
      $0162-$0169の敵IDに対応する、同種敵の個体番号/序数配列の先頭。
      北米NES版逆アセンブルでも$016A-$0171の対応配列を確認。
      FC日本版の実測では戦闘入口で非ゼロだがフィールドにも残るため、
      単独の戦闘判定には使わず、enemy_ids[0]とbattle_activeを併用する。
    values:
      field: 0x00
      in_battle: 0x01

  battle_active:
    addr: 0x0400
    size: 1
    confidence: likely
    description: |
      戦闘ライフサイクルの継続判定。戦闘中・1体撃破後・
      勝利メッセージ表示中=0x01、フィールド=0x00を実測。
      入口ではenemy_instance_numbers[0] + enemy_ids[0]とこの値を併用し、
      開始直後の過渡状態を除外する。開始後の継続にもこの値を使う。
    values:
      field: 0x00
      active: 0x01

  # --- 勝利時の報酬 ----------------------------------------------------
  # 勝利表示（menu_id が 0x1D / 0x2B）の瞬間に読む。
  # 画面の数字と RAM ダンプ6件を突き合わせて特定した（差分解析）。
  exp_gained:
    addr: 0x074F
    size: 1
    confidence: candidate      # ⚠ 実運用で矛盾が出た。実装では参考値として扱う
    description: |
      ⚠ 獲得経験値の候補だが**確定していない**。
      6件のRAMダンプでは画面の表示（3/4/4）と一致し唯一の候補だったが、
      実運用で矛盾が出た: 同じ「スライム×2」の戦闘で 3 / 1 / 3 とばらつく。
      DQ2 の経験値は敵ごとに固定なので、このアドレスは獲得経験値そのもの
      ではない可能性が高い（偶然一致していたと考えられる）。
      北米版逆アセンブルが示す $0626 は日本版では外れた（0 だった）。
      → 未解決。勝利表示のスクリーンショットと記録値を同一実行内で
        突き合わせる検証が必要。

  gold_gained:
    addr: 0x06E6
    size: 1
    confidence: likely
    description: |
      この戦闘で獲得したゴールド。勝利表示中に有効。
      実運用で一貫性を確認: スライム1体=2G、2体=4G、おおナメクジ1体=3G。
      （同条件で値がばらつく exp_gained と対照的で、こちらは信頼できる）
      北米版逆アセンブル bank4.asm でゴールド累算器として使われているアドレス
      （asl $06E6 / lda $06E6）と一致するため、これを採用した。
      差分解析では $0073 / $00A5 / $06E6 / $0771 の4件が同じ値を示し、
      観測データだけでは区別できなかった。逆アセンブルの裏付けで選んでいる。
      北米版が示す表示用バッファ $008F は日本版では外れた（100 だった）。

  menu_id:
    addr: 0x0059
    size: 1
    confidence: confirmed
    description: |
      メニューID。0x1D / 0x2B は勝利時の「経験値＋ゴールド」表示（VICTORY）。
      0x06 はフィールドのコマンドメニュー、0x09 は戦闘中のメニュー。
      実機で 0x1D の瞬間の画面に勝利メッセージが出ていることを確認済み。
      レベルアップ表示にも 0x1D が使われるため、報酬の読み取りには
      「値が変化した瞬間」ではなく実際の数値の妥当性も併せて見ること。
    values:
      victory_1: 0x1D
      victory_2: 0x2B
      field_command: 0x06
      battle_menu: 0x09

  # --- メニュー操作（マクロの記録・再現に使う）--------------------------
  menu_cursor_x:
    addr: 0x0082
    size: 1
    confidence: confirmed
    description: |
      メニューカーソルの水平位置（列）。逆アセンブル src/global/ram.asm に
      「Menu Cursor Horizontal Position」と定義がある。
      実測: フィールドのコマンドメニューで down/right の操作に追従して変化し、
      **端でラップしない**（最下行で down しても値が変わらない）。
      この性質のおかげで「目標位置へ寄せる」再現方式が決定的に書ける。
      戦闘中は 0xFF（無効値）になる。

  menu_cursor_y:
    addr: 0x0083
    size: 1
    confidence: confirmed
    description: メニューカーソルの垂直位置（行）。上記と同様。

  input:
    addr: 0x002F
    size: 1
    confidence: confirmed
    description: |
      ゲームが読んだ入力。B0=A B1=B B2=Select B3=Start B4=Up B5=Down B6=Left B7=Right。
      **joypad.set が実際にゲームへ届いているかを直接確認できる。**
      B-7（自動戦闘が終わらない）の原因特定はこのアドレスが決め手だった。
    bits:
      A: 0x01
      B: 0x02
      select: 0x04
      start: 0x08
      up: 0x10
      down: 0x20
      left: 0x40
      right: 0x80

  battle_phase:
    addr: 0x0073
    size: 1
    confidence: candidate
    description: |
      ⚠ 使ってはいけない。一度 confirmed としたが誤りだった。
      **正体はスクラッチ領域。** 獲得ゴールドの差分解析でこのアドレスが
      候補に挙がったことで判明した（勝利時にゴールドと同じ値を保持していた）。
      「戦闘フェーズなのに謎の値 0x01 を取る」という以前の観測はこれが原因。
      自動入力の条件に使うと入力されず戦闘が停止する。
    values:
      command: 0x02
      message: 0x00

  # --- 敵 --------------------------------------------------------------
  enemy_ids:
    addr: 0x0162
    size: 8                 # $0162-$0169。最大3体までしか観測できていない
    empty: 0xFF
    confidence: confirmed
    description: |
      戦闘に出現している敵のIDを、画面上の並び順どおりに1バイトずつ格納する配列。
      空きスロットは 0xFF。敵の数は 0xFF 以外のエントリ数で求まる。
      先頭IDは enemy_instance_numbers[0] と組み合わせ、戦闘開始の入口判定にのみ使用する。
      撃破済みスロットは0xFFになるため、戦闘継続判定には使用しない。
      size=8 は次の対応配列 $016A-$0171 と北米版逆アセンブルで裏取り済み。

  # --- 持ち物（どうぐメニューの行と対応）------------------------------
  inventory:
    addr: 0x0600
    slots: 8                  # 1人あたり8スロット
    stride: 0x08              # キャラ間の間隔
    empty: 0x00
    confidence: confirmed
    description: |
      各キャラの持ち物。**配列のインデックスがどうぐメニューの行番号に対応する。**
      実測で確認（work/itemmenu/）:
        $0600=55 → row0 かわのよろい
        $0601=46 → row1 どうのつるぎ
        $0602=3C → row2 やくそう
      これにより「行番号」ではなく「アイテムID」で目標を指定できる。
      行番号で記録すると所持品が変わった時点で壊れるため、
      マクロは必ずIDで探すこと。

  # --- メニューの行数 ---------------------------------------------------
  menu_row_count:
    addr: 0x0081
    size: 1
    confidence: confirmed
    description: |
      現在開いているメニューの行数。カーソル位置 $0082/$0083 の直前にある。
      ★終端マーカーを持たないリスト（店の品揃えなど）の長さはここで決まる。
      実測で4種類のメニューと一致（research/probes/archived/analyze_shopdiff.py / セーブ10件）:
        menu=18 売買選択（かいにきた/うりにきた = 2行） -> 2  ※3件で一致
        menu=16 品揃え（画面に4品）                     -> 4
        menu=09 戦闘コマンド（たたかう/にげる/じゅもん/どうぐ = 4行） -> 4  ※2件
        フィールド・勝利表示                            -> 0

  # --- 習得済みの呪文（ビットマスク）------------------------------------
  #
  # ★DEV-17「呪文の所持リストは RAM に無い」は**誤りだった**。
  #   見つけられていなかっただけ。逆アセンブル
  #   （work/dq2-disasm/src/us/prg/bank4.asm の B04_9EAC）に
  #   `sta $0618,y ; learned battle spell list` があった。
  #
  # 構造（2026-07-26 / work/spellbits.txt で実測）:
  #   $0618 サマルトリア 戦闘呪文    $0619 ムーンブルク 戦闘呪文
  #   $061A サマルトリア フィールド  $061B ムーンブルク フィールド
  #
  #   ★間隔は **1バイト**。パーティの 0x12 ではない（推測で決めなくてよかった）。
  #   ★ビットは**上位詰め**。枠0 = bit7、枠7 = bit0。
  #     ROM の `rol $99` が左回転で、最初に見た枠が最上位へ押し上げられるため。
  #   ★ローレシアは呪文を持たないので領域が無い。
  #
  # 枠の順（ROM の SpellLevels / bank4.asm:9700）と習得レベルは
  # 下の slot_table に**呪文IDで**入れてある。
  # ★名前ではなくIDで持つ。日本語名は実測できたものにしか付けられないが、
  #   ID は ROM の事実なので推測が混じらない（items と同じ方針）。
  #   例: サマルトリア field 枠1 = 0x10 Antidote = キアリー（実測で確定）。
  #
  # ★習得は「レベル >= 習得レベル」の単純比較で、**揺らぎは無い**。
  #   実測で裏付け済み: サマルトリア LV12->C8 / LV13->C8 / LV14->CC が
  #   3つのスロットで予測と1ビットの狂いもなく一致した。
  #
  # ★これが読めると何が要らなくなるか:
  #   ・呪文リストの行番号を設定に書くこと（覚えると並びが変わる問題）
  #   ・唱える人を固定すること（caster。誰が何を持つかは枠で決まる）
  #   ・画面のタイルを読むこと
  #   立っているビットを数えれば**行番号を計算できる**。
  #
  # ⚠ 呪文リストの並び方はメニューごとに違う（実測）:
  #   0x07 戦闘中の呪文リスト = **列優先**（下へ進んでから右へ）
  #   0x08 戦闘中のどうぐ     = **行優先**
  #   流用してはいけない。
  #
  # ★★ 枠から画面位置への変換は ROM で確定した（2026-07-26）★★
  #   逆アセンブル constant.asm の $F33x（メニュー1項目ぶんの呪文を決める処理）:
  #
  #   ・**戦闘(0x07)** … マスク = (0x88 >> (項目番号>>1)) & (項目番号が偶数 ? 0xF0 : 0x0F)
  #       つまり **枠k -> 列 floor(k/4) / 行 k%4**。
  #       列0 = 枠0..3 / 列1 = 枠4..7 の**固定4行2列**。
  #       ROM の BattleSpells（bank6.asm:8948）の並び 01,09,06,0B,03,0A,04,0C が
  #       枠 0,4,1,5,2,6,3,7 の順になっていることと一致する。
  #       実測（O-4 / サマルトリア LV9 = 枠0,1,4）とも一致:
  #         (列0,行0) ギラ / (列0,行1) マホトーン / (列1,行0) ホイミ / (列1,行1) 空
  #   ・**フィールド(0x14)** … 1列。行数は $EF13 が**立っているビットを数えて**決める。
  #       つまり **行 = それより前の枠で習得済みの数**（詰まる）。
  #
  #   ★この2つは実は同じ答えになる。SpellLevels の習得レベルが
  #     列ごと・リストごとに**昇順**に並んでいるため、習得済みの枠は必ず先頭から
  #     連続する（穴が開かない）。だから「詰める」も「固定位置」も同じ位置を指す。
  #     dq2.lua は両方を計算し、**食い違ったら nil を返す**（前提が崩れた合図）。
  learned_spells:
    battle:
      samaltria: { addr: 0x0618, size: 1, confidence: confirmed }
      moonbrooke: { addr: 0x0619, size: 1, confidence: confirmed }
    field:
      samaltria: { addr: 0x061A, size: 1, confidence: confirmed }
      moonbrooke: { addr: 0x061B, size: 1, confidence: confirmed }
    # 枠0 が最上位ビット
    slots: 8
    bit_order: high_first

    # 画面の形。戦闘は2列固定4行 / フィールドは1列。
    layout:
      battle: { menu: 0x07, columns: 2, rows: 4 }
      field:  { menu: 0x14, columns: 1, rows: 8 }

    # 枠の中身（ROM SpellLevels / bank4.asm:9700 の並びそのまま）。
    # id は呪文ID（下の spells を参照）。level は習得レベル。
    # id: 0 は「枠なし」（ROM の $FF）。
    slot_table:
      samaltria:
        battle:
          - { id: 0x01, level: 3 }    # 列0行0
          - { id: 0x06, level: 8 }    # 列0行1
          - { id: 0x03, level: 18 }   # 列0行2
          - { id: 0x04, level: 23 }   # 列0行3
          - { id: 0x09, level: 1 }    # 列1行0  ★Heal = ホイミ
          - { id: 0x0B, level: 14 }   # 列1行1
          - { id: 0x0A, level: 20 }   # 列1行2
          - { id: 0x0C, level: 28 }   # 列1行3
        field:
          - { id: 0x09, level: 1 }    # ホイミ（実測）
          - { id: 0x10, level: 6 }    # ★キアリー（実測で確定）
          - { id: 0x14, level: 10 }   # ⚠ Return。実行すると戻せない
          - { id: 0x12, level: 12 }
          - { id: 0x0B, level: 14 }
          - { id: 0x16, level: 17 }
          - { id: 0x17, level: 25 }
          - { id: 0x00, level: 255 }
      moonbrooke:
        battle:
          - { id: 0x02, level: 2 }    # 列0行0
          - { id: 0x05, level: 4 }    # 列0行1
          - { id: 0x07, level: 6 }    # 列0行2
          - { id: 0x0E, level: 19 }   # 列0行3
          - { id: 0x0B, level: 1 }    # 列1行0
          - { id: 0x08, level: 10 }   # 列1行1
          - { id: 0x0D, level: 15 }   # 列1行2
          - { id: 0x0F, level: 25 }   # 列1行3
        field:
          - { id: 0x0B, level: 1 }
          - { id: 0x13, level: 8 }
          - { id: 0x10, level: 12 }   # ★キアリー。サマルトリアとは**行が違う**
          - { id: 0x0D, level: 15 }
          - { id: 0x12, level: 17 }
          - { id: 0x16, level: 21 }
          - { id: 0x15, level: 23 }
          - { id: 0x00, level: 255 }

  # --- 戦闘中「いま誰の入力待ちか」（O-2 / AI の前提）--------------------
  #
  # ★なぜ必要か: 戦闘コマンドメニュー(0x09)の**行1は人によって中身が違う**。
  #   ローレシア（MP 0）  = にげる / MPを持つ人 = じゅもん
  #   誰の番か分からないまま行1を押すと**ローレシアが逃げ出す**。
  #   回復呪文を唱える AI（P3）はこの値が無いと作れない。
  battle_input_member:
    addr: 0x00A8
    size: 1
    confidence: confirmed
    description: |
      戦闘中、いま入力を求められているメンバーの添字（0始まり / 並び順）。
      1人目=0 / 2人目=1 / 3人目=2。次のターンで 0 に戻る。
      戦闘コマンド(0x09)と敵の対象選択(0x0A)のどちらでも同じ人を指す。

      根拠（work/o2/verify.txt / 17項目すべて一致）:
        ・3つの戦闘（敵の構成2種類: よろいムカデ+キングコブラ / おおねずみ）で
          いずれも 0,1,2 になった
        ・★B（キャンセル）で1人前に戻すと **値も 01 -> 00 に戻った**。
          単に増えるだけのカウンタなら戻らないので、これが決定的な証拠。
        ・同じ入力待ちのあいだ20フレーム離して2回読んでも値は動かない
          （アニメーション・乱数・タイマーではない）

      ⚠ **戦闘外では信じてはいけない。** フィールドでは $00A8=00 なのに
        $00B9=51（3人目を指す）と互いに矛盾した値が残っていた。
        値があること≠有効（playbook #14）。in_battle を確認してから読む。

      ⚠ **未検証: 死亡・行動不能で1人飛ばされる場合。**
        添字が 0,2 と飛ぶのか 0,1 と詰まるのかを確認できていない
        （メンバーを死なせる状況を作れていない。RAM を書き換えて偽の状態を
        作ることはしない方針）。そのため下の交差検証を必ず行い、
        矛盾したら AI は動かないこと。

  battle_input_member_alt:
    addr: 0x00AA
    size: 1
    confidence: confirmed
    description: |
      $00A8 と同じ値を持つ別のバイト（3つの戦闘すべてで一致）。
      用途の違いは不明。交差検証の材料として記録しておく。

  battle_input_member_ptr:
    addr: 0x00B9
    size: 1
    confidence: confirmed
    description: |
      入力待ちメンバーの**状態バイトのアドレス下位1バイト**。
      実測 2D / 3F / 51 = $062D / $063F / $0651（= 0x2D + 添字 * 0x12）。

      ★交差検証に使う: `0x2D + battle_input_member * 0x12` と一致するか。
        一致しなければ「読めていない」と判断して AI は手を出さないこと。
        フィールドでは実際に一致しなかった（$00A8=00 に対して $00B9=51）ので、
        この検査は無効な状態を実際に弾ける。

  # --- 店の品揃え（購入マクロが使う）------------------------------------
  shop_list:
    addr: 0x0100
    stride: 3                 # [アイテムID, 値段(16bit LE)]
    max_rows: 8
    confidence: confirmed
    description: |
      店の品揃えリスト。3バイト刻みで [アイテムID, 値段下位, 値段上位]。
      **行番号がカーソル行に対応する。**

      ★★ 重要な訂正（2026-07-25）★★

      当初この項目を confidence: confirmed とし「ID=0 で終端」「売買選択(0x18)の
      時点で既に埋まっている」と書いていたが、**どちらも誤りだった。**
      根拠が「一度品揃えを開いた履歴のあるセーブ1件」しかなかった。

      1. **品揃えリスト(0x16)を開いている間だけ有効。**
         売買選択(0x18)の時点では埋まっていない。実測（スロット6）:
           menu=18: 00 01 00 00 00 00 00 00 00 00 00 00 ...  空
           menu=16: 3C 0F 00 3B 08 00 35 50 00 34 28 00 ...  4品
         「押す前に買える物を判定できる」という前提は成立しない。

      2. **終端マーカーは無い。** 行数は menu_row_count($0081) で決まる。
         上記の例では $0081=4 で、5行目以降は前の内容の残骸:
           行4: ID=9A 値段=5   行5: ID=1C 値段=90  ← どちらも画面に無い
         ID=0 を終端とみなすと、残骸を品揃えとして読んでしまう。

      3. ここは 6502 のスタックページ($0100-$01FF)。他の用途の値が残る。
         **メニューIDと行数を確認せずに読んではいけない。**

      画面との一致（work/shopfind/02_shop_list.png / 4行すべて）:
        行0 やくそう 15G / 行1 どくけしそう 8G
        行2 キメラのつばさ 80G / 行3 せいすい 40G

  # --- パーティ --------------------------------------------------------
  # 以下は日米の公開資料で一致していたアドレス（docs/10-research-notes.md R-3）。
  # current_hp のみ実測で確認済み。他は未検証。
  party:
    member_stride: 0x12     # ローレシア -> サマルトリア -> ムーンブルク
    # ★役割名（表示に使うのは下の `names` から読んだ**ゲーム内の名前**）
    members: [lorasia, samaltria, moonbrooke]
    # --- ゲーム内で付けた名前（2026-07-29 に解読）------------------------
    #
    # ★★ **長年「読めていない」だった項目が解けた** ★★
    #   文字コード表を CHR-RAM の字形から起こしたため
    #   （`docs/how-to-read-rom.md` 5章）。以前は
    #   「先頭4バイト `0A 0F 31 5F` が『あかり␣』と読める」までで止まっていた。
    #
    # 実測（`tools/fceux/fcs/DQ2_J.fc1`）:
    #   $0113: 0A 0F 31 5F FA 48 59 4B 55 FA 50 31 3C 5F
    #          あ か り ␣  | ト ン ヌ ラ  | マ り ア ␣
    #
    # → **1人4バイト、`0xFA` 区切り**。空きは `0x5F`（空白）で埋める。
    #
    # ⚠ FC のフォントには**カタカナのリが無く、ひらがなの り を共用**している。
    #   だから「マりア」と読める。**画面に出るとおり**なので直さない。
    #   気に入らなければ `user_config.yaml` の `names` で上書きできる。
    names:
      addr: 0x0113
      length: 4             # 1人ぶんの文字数
      separator: 0xFA
      confidence: verified
    fields:
      status:      { offset: 0x062D, confidence: likely }
      max_hp:      { offset: 0x0630, confidence: likely }
      max_mp:      { offset: 0x0632, confidence: likely }
      current_hp:  { offset: 0x063B, confidence: confirmed }
      current_mp:  { offset: 0x063D, confidence: likely }
      # ★経験値は**3バイト**（逆アセンブル src/global/ram.asm）。
      #   0x0633 = 下位 / 0x0634 = ×256 / 0x0635 = ×65536
      #   2バイトだと LV30 以降のムーンブルク（+65536）で足りない。
      experience:  { offset: 0x0633, size: 3, confidence: likely }
      # ★★ ちから・すばやさ（2026-07-31 に特定）★★
      #
      #   依頼者が**「つよさ」の画面を開いた状態でセーブ**してくれたので、
      #   画面の数字を手がかりに探せた。あかり（0番目）で **9項目すべて一致**:
      #
      #     さいだいHP 101 / さいだいMP 0 / 経験値 60357 /
      #     ちから 81 / すばやさ 59 / こうげき力 146 / しゅび力 104 /
      #     いまのHP 89 / LV 21
      #
      #   ★位置も筋が通る。経験値（+3〜+5 の3バイト）と
      #     こうげき力（+8）の**隙間にぴったり収まる**（+6 と +7）。
      #     説明の付かない空きが残らない。
      #
      #   ⚠ 「ちから」と「こうげき力」は**別物**（こうげき力 = ちから + 武器）。
      #     混ぜると装備の効果が見えなくなる。
      strength:    { offset: 0x0636, confidence: likely }
      agility:     { offset: 0x0637, confidence: likely }
      # 逆アセンブル src/global/ram.asm より（Hero's Attack/Defence Power）。
      # ★2026-07-31 に「つよさ」の画面と突き合わせて一致を確認した。
      attack:      { offset: 0x0638, confidence: confirmed }
      defense:     { offset: 0x0639, confidence: confirmed }
      # ★画面表示と一致を確認（work/b11/08_target_rows.png の「あかり 8」= $063E が 8）。
      # 警戒リストのレベルアップ解除に使う（config の caution.clear_on_level_up）。
      level:       { offset: 0x063E, confidence: confirmed }
    # 状態バイトのビット割り当て
    #
    # ★★ 全ビットが判明した（2026-07-26 / Phase 6 P4-0）★★
    #
    # 出典: 逆アセンブル `bank4.asm:5077` の構造体表のコメント
    #   `$062D; Midenhall status (80 = Alive, 40 = Sleep, 20 = Poison, 10 = ?,
    #    08 = ?, 04 = In Party, 02 = Surround, 01 = Silence)`
    #
    # → ★**B-10（睡眠の状態ビット）はこれで埋まった**（0x40）。
    #   ずっと `global/ram.asm` の側を見ていたが、**戦闘バンクの構造体表**に
    #   全ビットの一覧が書かれていた（探す場所を変えたら1行で出た）。
    #
    # ⚠ **実測はまだ**なので追加分は confidence: likely 相当の扱いにする。
    #   in_party / poison / alive の3つだけが実測済み（下記の経緯）。
    #   眠り・マヌーサ・マホトーンの状態を作るには
    #   **敵にかけられる必要があり**、意図して作るのが難しい。
    #   ⚠ RAM を書き換えて偽の状態は作らない方針（既存の作法）。
    #
    # ★Phase 6 で効くのは **silence(0x01) = マホトーン**:
    #   かけられている人は呪文を唱えられないので、**呪文リストを開こうとしない**。
    #   いまの P3 はこれを見ていないため、押しても進まず16回で諦める
    #   （壊れはしないが無駄）。
    #
    # ⚠ 0x10 / 0x08 は逆アセンブルでも `?` のまま。**列を作らない。**
    #
    # ★加入判定は必ず bit2 を使う。max_hp > 0 では判定できない。
    #   実測: 単独パーティ（ローレシアのみ）でも $0630/$0642/$0654 は
    #   3人分すべて 0 以外の値を持つため、max_hp では3人と誤カウントする。
    #   これにより「生存者が1人になったら危険」という安全機構が
    #   発火しない不具合があった（全10セーブステートで食い違いを確認）。
    #
    # ⚠ ビットは**必ずマスクで判定する**（等値比較は他のビットで外れる / playbook #15）。
    #   通常時 $84・毒中 $A4 のどちらも `status == 0x20` には一致しない。
    status_bits:
      silence:  0x01      # マホトーン。★呪文を唱えられない（実測はまだ）
      surround: 0x02      # マヌーサ（実測はまだ）
      in_party: 0x04      # ★実測済み
      poison:   0x20      # ★実測済み
      sleep:    0x40      # 眠り。B-10 の答え（実測はまだ）
      alive:    0x80      # ★実測済み

  # --- 敵の戦闘データ（★個体HPは 2026-07-26 に確定。下の instance_fields）--
  #
  # ★逆アセンブルで**場所と大きさ**までは確定した
  #   （work/dq2-disasm/src/us/prg/bank4.asm の B04_9F21 / B04_9F33 の表）:
  #
  #     $0663-$068E … 敵**グループ**の構造体（4組 × 11バイト）
  #     $068F-$06C6 … 7バイト × n の構造体（個体ぶんと思われる）
  #
  #   グループ構造体で分かっている並び:
  #     +0 … モンスターID（`sta $0663, x ; monster ID, group 1`）
  #     +9 … 残り体数（`dec $066C, x` で減る / $066C = $0663 + 9）
  #     初期化は $FF を 0x2C バイト（= 4組×11）書き込む（B04_837e）
  #
  # ⚠ **どのバイトが個体のHPかは、まだ分かっていない。**
  #   逆アセンブルのコメントに HP と書かれていないため、ここは実測で決める。
  #   research/probes/archived/enemyhp_probe.lua が「戦闘中に減ったバイト」を記録する。
  #   ダメージ量と一致して減るバイトがHPである。
  #
  # ★分かるまで**書かない**。それらしいオフセットを推測で入れると、
  #   画面に出た数字が本物に見えてしまう（items の日本語名と同じ方針）。
  enemy_battle:
    group_base: 0x0663
    group_stride: 11
    group_count: 4
    group_fields:
      monster_id: { offset: 0, confidence: confirmed }
      remaining:  { offset: 9, confidence: likely }
    instance_base: 0x068F
    instance_stride: 7
    instance_count: 8

    # --- 個体の中身（2026-07-26 に確定）--------------------------------
    #
    # ★ROM の初期化コード（bank4.asm:9138 B04_B6AB）が決め手:
    #
    #     lda ($BB), y   ; y=0 → 敵ステータス表の +0 = 最大HP
    #     sec
    #     sbc $9D        ; 最大HP - (最大HP/4 × 乱数/256)  ← 75〜100%のばらつき
    #     ldy #$04
    #     sta ($B7), y   ; 個体構造体の +4 へ（下位）
    #     iny
    #     lda #$00
    #     sta ($B7), y   ; +5 へ 0（上位）
    #
    #   同じ処理が +6 に敵ステータス表の +6（守備力）を写している。
    #   ルカニ等で下げられるよう、個体ごとに持っているのだと分かる。
    #
    # ★実測でも一致（work/enemyhp.txt / 5戦闘）:
    #   6体の戦闘で 個体0=55 / 個体1=52 / 個体2=22 … から始まり、
    #   **55->26（29ダメージ）/ 52->30（22ダメージ）** と減った。
    #   倒れると別の値に飛ぶ（構造体が次の用途へ回る）ので、
    #   「残り体数」や状態と併せて読むこと。
    #
    # ⚠ **最大HPは RAM に無い**（ROM のステータス表にしかない）。
    #   画面では「戦闘開始時のHP」を分母にする。それが実際に
    #   プレイヤーの見ている「満タン」だから（推測の最大値を出さない）。
    instance_fields:
      status:  { offset: 0, confidence: likely }      # 眠り・マホトーン等のビット
      hp:      { offset: 4, size: 2, confidence: confirmed }   # 16bit・リトルエンディアン
      defense: { offset: 6, confidence: likely }

    # --- 敵の状態ビット（2026-07-26 / Phase 6 P4-0 で追加）----------------
    #
    # ⚠⚠ **パーティ（$062D）とは割り当てが違う。** 混ぜてはいけない。
    #   パーティ: 0x40 = 眠り / 0x01 = マホトーン
    #   敵:       0x80 = 眠り / 0x40 = マホトーン / 0x01 = マヌーサ
    #
    # 出典は逆アセンブルの**実コード**（コメントではない / bank4.asm:6180 付近）:
    #   呪文の効果を適用する分岐で、状態を立てる前に $A1 にマスクを入れている
    #     0x02 Sleep(ラリホー)      -> lda #$80
    #     0x06 Stopspell(マホトーン) -> lda #$40
    #     0x07 Surround(マヌーサ)    -> lda #$01
    #   そのあと `ldy #$00 / lda ($B7),y / and $A1` で
    #   「既に立っていたら何もしない」を判定している（$B7 = $068F の個体）。
    # ★回避の判定でも `ldy #$00 / lda ($B7),y / bmi` と bit7 を見ており、
    #   眠っている敵は回避しない。0x80 = 眠り と整合する。
    #
    # ⚠ **実測はまだ**（confidence: likely）。Phase 6 の P4・P8 で
    #   「デバフが効いたか」をこのビットで検証するときに裏が取れる。
    #   ★そのとき「立ったこと」だけでなく **狙った個体に立ったこと**を見る
    #     （P3 で対象のずれを検出できた形と同じ）。
    instance_status_bits:
      surround:  0x01     # マヌーサ
      stopspell: 0x40     # マホトーン
      sleep:     0x80     # 眠り（ラリホー）

  # --- その他 ----------------------------------------------------------
  player_x:
    addr: 0x0016
    size: 1
    confidence: confirmed
    description: プレイヤー座標X。セーブステートのロードと移動で実測確認。

  player_y:
    addr: 0x0017
    size: 1
    confidence: confirmed
    description: プレイヤー座標Y。

  gold:
    addr: 0x0624
    size: 2                 # リトルエンディアン
    confidence: confirmed
    description: >
      所持ゴールド。公開資料由来だったが、2026-07-31 に**実測で確認**した。
      「つよさ」の画面を開いた状態のセーブステートで
      130 + 61×256 = 15746 となり、画面の「G: 15746」と一致。

  # --- いまどこに居るか（2026-07-27 / 依頼者の指摘）---------------------
  #
  # > 街にいる場合と、フィールドにいる場合で処理を変えたほうがいいかと思う
  #
  # 出典: 逆アセンブル `work/dq2-disasm/src/global/ram.asm:21`
  #   `map_id: .res 1 ; $31 / True Room ID`
  #
  # ⚠ **どの値が街で、どの値がフィールドかは分かっていない。**
  #   逆アセンブルにも一覧が無い。だから
  #   **「この値は街」という判断をコードに書かない。**
  #   使い方は「値が変わったことを記録する」「同じ場所で戦闘が起きないと
  #   分かったら止める」までにする（research/probes/archived/art_capture_run.lua を参照）。
  #
  # ★ドロップ判定に `cmp #$04 ; guaranteed drop` という分岐があり
  #   （bank4.asm:3524）、そこでもこのアドレスが使われている。
  #   4 = ローレシア地下（北米版のコメント）。1件だけ分かっている値。
  map_id:
    addr: 0x0031
    size: 1
    confidence: likely
    description: |
      いま居る場所のID（逆アセンブルの `map_id` / True Room ID）。
      ★種別の判定は `$E20C` にある（2026-08-02 / `bgmap/dungeon_map.py:map_kind`）:
        $01=世界地図 / <$2B=街・城 / <$44=ダンジョン / それ以外=別タイルセット。
      ⚠ 「どの値がどの町か」の名前の表は ROM に無い（`locations.yaml` で持つ）。
      観測用（同じ場所に留まっているかを見る）にも使う。

  # --- 主人公の座標（2026-07-29 / 地図のため）--------------------------
  #
  # 出典: 逆アセンブル `work/dq2-disasm/src/global/ram.asm`
  #   `map_xpos: .res 1 ; $16` / `map_ypos: .res 1 ; $17`
  #
  # ★★ 実測で確かめてある ★★
  #   `research/probes/archived/verify_disasm.py` が10個のセーブステートから読み、
  #   マップと矛盾しない値（例 map 07 で (20,21) / map 01 で (109,96)）に
  #   なることを確認済み。**推測ではない。**
  #
  # ★何に使うか: 「自分が歩いた所」を記録して地図に出す（依頼者の決定 / Q3）。
  #   ⚠ **全体地図を出すためではない。** 完全地図を最初から見せると
  #     ダンジョンの探索が消える（RetroUX の原則に反する）。
  map_x:
    addr: 0x0016
    size: 1
    confidence: verified
    description: |
      主人公のX座標（マップ内のマス）。逆アセンブルの `map_xpos`。
      10個のセーブステートで実測済み。
  map_y:
    addr: 0x0017
    size: 1
    confidence: verified
    description: |
      主人公のY座標（マップ内のマス）。逆アセンブルの `map_ypos`。
      10個のセーブステートで実測済み。

  # --- 画面のスクロール量（2026-08-01 / 課題 #65）------------------------
  #
  # ★★ **実測で決めた。憶測ではない。** ★★
  #
  # ⚠ NES のスクロールレジスタ $2005 は**書き込み専用**で読めない。
  #   ゲームは自分のスクロール量を RAM に持っているはずなので、そこを探した。
  #
  # 1. ネームテーブル $2000 の「空白タイルの並び」と画面の「黒いマスの並び」が
  #    一番合うずれを **960通り総当たり**した（scroll_find_probe.lua）
  #      -> よこ 4 タイル(32画素) / たて 14 タイル(112画素) で一致 98%
  #         2位は 93%。★ピークが立っている
  # 2. そのとき $0005 = 32、$0006 = 112。★画素の値と**完全一致**
  # 3. 左に1マス動かすと $0005 は 32 -> 16、当てはめのずれも 4 -> 2 タイル。
  #    ★**予想したとおりに動いた**（scroll_confirm_probe.lua / 一致 99%）
  # 4. マスごとの照合（tile_read_check_probe.lua）:
  #      足さない 459/704 (65%) -> ★足した 695/704 (98%)
  #
  # ★何に使うか: ネームテーブルのタイルIDと画面の位置を対応させる。
  #   ⚠ これを足さないと、地図が空白だらけになる（391マス中 362 が空白だった）。
  #
  # ⚠ $2400 は 960 マスすべて空白のまま動かない。**使っていない**。
  scroll_x:
    addr: 0x0005
    size: 1
    confidence: verified
    description: |
      画面の横スクロール量（画素）。ネームテーブルの列 = (画面の列 + この値/8) % 32。
      左に1マス動かすと 32 -> 16 に減ることを実測済み。
  scroll_y:
    addr: 0x0006
    size: 1
    confidence: verified
    description: |
      画面の縦スクロール量（画素）。ネームテーブルの行 = (画面の行 + この値/8) % 30。
      上に1マス動かすと 112 -> 96 に減ることを実測済み。

  # --- いま読み込んでいるマップのデータ位置（2026-07-29）----------------
  #
  # ★★ これが「ヘッダ表のバイト3-4がマップデータのポインタである」ことの
  #   **実機での裏取り**になった ★★
  #     セーブステート fc1/fc2/fc7 (map 07) -> $8E83
  #     ヘッダ表の map 07 のバイト3-4      -> $8E83   ← 一致
  #     fc5 (map 0B) -> $92BD / 表も $92BD
  #     fc3 (map 59) -> $A48B / fc4 (map 63) -> $A75F
  #
  # ★2026-08-21 訂正（RX-0010）: 以前「展開する手順は日本版では未解読」とあったが、
  #   2026-08-09 に街・ダンジョン 108/108、08-11 に世界地図を解読済み
  #   （`docs/map-decoder-evidence.md`）。ここでは位置の確認に使う。
  map_data_pointer:
    addr: 0x0023
    size: 2
    confidence: verified
    description: |
      いま読み込んでいるマップのデータ位置（bank 2 の CPU アドレス）。
      逆アセンブルの `$23-$24`（map pointer）。
      ROM のマップヘッダ表のバイト3-4 と一致することを実機の
      セーブステート4件で確認済み。

