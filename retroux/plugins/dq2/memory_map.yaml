# --- メニューの項目配置 -----------------------------------------------
#
# マクロのログに人が読めるメモを残すため、および
# 「行番号が何に対応するか」を1か所にまとめるために使う。
#
# ★行数は $0081（menu_row_count）で読める。期待した人数・件数と一致するかを
#   確かめれば「何が並ぶメニューか」の前提が崩れていないか検証できる。
menu_layouts:
  0x01:                       # アイテム使用後などのメッセージ
    name: メッセージ
    # ⚠ ここから A でフィールドへ戻ろうとしてはいけない。
    #   実測: A では 01 -> 06(コマンドメニュー) -> 04 -> 06 -> 04 ... と循環し、
    #   10回押しても menu=00 に戻らなかった（06 に戻った時点で A が
    #   「はなす」を実行してしまうため）。**B で閉じる**（実測4回以内）。
    #   同種の失敗は B-7（戦闘の ABAB 無限ループ）でも踏んでいる。

  0x06:                       # フィールドのコマンドメニュー
    name: フィールドコマンド
    items:
      "0,0": はなす
      "1,0": じゅもん
      "0,1": つよさ
      "1,1": どうぐ
