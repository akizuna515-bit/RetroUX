# --- 呪文IDの対応表 ---------------------------------------------------
#
# 逆アセンブルから抽出（すべて ROM の事実。推測なし）:
#   name       … bank6.asm:9819 SpellNames（北米版の英語名）
#   mp_battle  … bank4.asm:8812 MP Cost in Battle (normal)
#   mp_field   … bank6.asm:8CE6 MP Cost for Spells on Field
#   target     … bank4.asm:B518 Base Target（0=対象なし / 1=敵を選ぶ / 2=味方を選ぶ）
#
# ★target が決定直後のメニューIDを予言する（O-5 と一致）:
#     1 -> 0x0A 敵の対象選択 / 2 -> 0x0B 味方の対象選択 / 0 -> 対象を聞かれない
#   AI が「これから押す行が本当に回復呪文か」を**押す前に**照合できる。
#
# ⚠ mp_battle は**ふしぎなぼうし**を装備していると下がる（bank4.asm:8828）。
#   MPの減り方で検証するときは「減った」だけを見て、値を等号で見ないこと。
#
# 日本語名は items / monsters と同じ方針で、**画面で実測できたものだけ**に付ける。
# 残りは北米版の英語名。英語名から日本語名を推測して書かない。
#
# --- 唱えてはいけない呪文（never_cast / 2026-07-26 / Phase 6 P4-0）------
#
# ★`never_cast: true` を付けた呪文は、**マクロも AI も絶対に選ばない**。
#   判定は `DQ2:spell_denied(id)` の1か所に集約してある（呼び出し側で書かない）。
#   `never_cast_reason` はログに出す文字列。理由を出さない拒否は、
#   利用者から見ると「動かない」と区別できない（playbook「ログは直せることだけ出す」）。
#
# ⚠⚠ **なぜ Phase 6 で急に必要になったか。**
#   P3（回復呪文）は「heal: true かつ 味方を狙う」で絞っていたため、
#   危険な呪文は**構造的に候補に入らなかった**。
#   攻撃呪文を許した瞬間にこの絞りが効かなくなる。
#   そして戦闘呪文リストの**枠7（列1・行3）**は ROM の SpellLevels によると
#     サマルトリア LV28 -> **メガンテ(0x0C)** … 唱えた本人が死ぬ
#     ムーンブルク LV25 -> **パルプンテ(0x0F)** … 効果がランダム
#   になる。**位置を1つ間違えたら仲間が死ぬ**（ルーラの事故と同じ種類で、被害は重い）。
#
# ★呪文はIDで指定するので選ぶ経路自体が無いが、**二重の歯止め**として置く。
#   ルーラで学んだこと: 経路が無いことと、押さないことは別に担保する。
# --- ★ 攻撃呪文の威力（2026-08-03 / 「ガンガン行こうぜ」）---------------
#
# ★★ **出典は依頼者が示した攻略情報です。** ★★
#   `damage_min` / `damage_max` / `damage_avg` / `scope` を持たせます。
#
# ⚠⚠ **ROM の逆アセンブルとは食い違いました**（★黙って合わせません）。
#
#   逆アセンブル（`work/dq2-disasm/src/us/prg/bank4.asm`）には
#   `lda #$18 ; Power` のように威力が書かれており、
#   `B04_AE8C` のコメントは「$B0 = A / 2 を中心にばらつく乱数」です。
#
#   | 呪文 | ROM の Power | ★式の予測 | ⚠ 攻略情報（日本版） |
#   | --- | --- | --- | --- |
#   | ギラ | `#$18`=24 | 中心 12 | **12〜28（中心20）** |
#   | ベギラマ | `#$32`=50 | 中心 25 | 13〜35（中心24） |
#   | イオナズン | `#$82`=130 | 中心 65 | 32〜91（中心61） |
#
#   ★ベギラマとイオナズンは近いのに、**ギラだけ倍近く違います**。
#   ⚠ しかも参照した逆アセンブルは **北米版**（`src/us/`）で、
#     日本版と威力が違う可能性があります（日本版の bank4 は未整備）。
#
#   ★そこで**攻略情報を正本**にし、ROM の値は出典として併記します。
#   ⚠ ROM から自動抽出する道具は作っていません（★食い違う値を
#     機械的に取り込むと、どちらが正しいか分からなくなるため）。
#
# scope の意味（★対象の広さ。`target` とは別）:
#   single … 敵1体      group … 敵1グループ      all … 敵全体
#
# ⚠ `target` は「カーソルで選ぶか」（1=選ぶ / 0=選ばない / 2=味方）で、
#   **広さは表していません**。だから `scope` を別に持ちます。
spells:
  # ★ギラ。まどうしのつえ で同じ効果が出せる（→ config の道具代替）
  0x01: { name: Firebal,   mp_battle: 2,  target: 1,
          damage_min: 12, damage_max: 28, damage_avg: 20, scope: single,
          rom_power: 0x18, source: 攻略情報（依頼者提供 / 2026-08-03） }
  0x02: { name: Sleep,     mp_battle: 2,  target: 1 }
  # ★ベギラマ
  0x03: { name: Firebane,  mp_battle: 4,  target: 0,
          damage_min: 13, damage_max: 35, damage_avg: 25, scope: all,
          rom_power: 0x32, source: 攻略情報（依頼者提供 / 2026-08-03） }
  0x04: { name: Defeat,    mp_battle: 4,  target: 1 }
  # ★バギ。いかづちのつえ / いなずまのけん で同じ効果（→ 道具代替）
  # ⚠ 名前が Infernos なのは北米版の呼び方。MP4・敵1グループが攻略情報と一致
  0x05: { name: Infernos,  mp_battle: 4,  target: 1,
          damage_min: 13, damage_max: 35, damage_avg: 25, scope: group,
          source: 攻略情報（依頼者提供 / 2026-08-03） }
  0x06: { name: Stopspell, mp_battle: 3,  target: 1 }
  0x07: { name: Surround,  mp_battle: 2,  target: 1 }
  0x08: { name: Defence,   mp_battle: 2,  target: 0 }
  # ★実測で確定（work/mantan/kiari.txt / サマルトリアの呪文リスト行0 -> HP +16）
  0x09: { name: ホイミ,     mp_battle: 3,  mp_field: 3,  target: 2, heal: true }
  0x0A: { name: Increase,  mp_battle: 2,  mp_field: 0,  target: 0 }
  0x0B: { name: Healmore,  mp_battle: 5,  mp_field: 5,  target: 2, heal: true }
  # ⚠⚠ Sacrifice（メガンテ）。**唱えた本人が死ぬ。**
  #   さらに敵ID >= 0x4E（ボス）には効かないので、ボス戦では死に損になる
  #   （bank4.asm:6167 の分岐で確定）。サマルトリア LV28 で枠7 に現れる。
  0x0C: { name: Sacrifice, mp_battle: 1,  mp_field: 0,  target: 0,
          never_cast: true, never_cast_reason: 唱えた本人が死ぬ }
  0x0D: { name: Healall,   mp_battle: 8,  mp_field: 8,  target: 2, heal: true }
  # ★イオナズン
  0x0E: { name: Explodet,  mp_battle: 8,  mp_field: 0,  target: 0,
          damage_min: 32, damage_max: 91, damage_avg: 60, scope: all,
          rom_power: 0x82, source: 攻略情報（依頼者提供 / 2026-08-03） }
  # ⚠⚠ Chance（パルプンテ）。**効果がランダムで予測できない。**
  #   ROM の $A7C0 には効果番号ごとに別のメッセージが並んでおり（例: Effect #08 Revive Max）、
  #   何が起きるかを事前に決められない。ムーンブルク LV25 で枠7 に現れる。
  #   ★「予測できない」ものを AI に選ばせない、が判断（効果の良し悪しではない）。
  0x0F: { name: Chance,    mp_battle: 15, mp_field: 0,  target: 3,
          never_cast: true, never_cast_reason: 効果がランダムで予測できない }
  # ★実測で確定（同上 / 行1 -> 毒が消えた・MP -3）。config の mp_cost 2 は ROM では 3。
  0x10: { name: キアリー,   mp_field: 3,  target: 2, cure_poison: true }
  0x11: { name: Heal,      mp_field: 2 }          # 敵専用。味方は使わない
  0x12: { name: Outside,   mp_field: 6 }
  0x13: { name: Repel,     mp_field: 2 }
  # ⚠⚠ Return（ルーラ）。**実行すると町へ飛ばされ、プレイ中には戻せない。**
  #   行番号を1つ間違えるとこれを唱える事故が起きる。irreversible を見て
  #   「押す直前に照合し、違えば押さない」を強制する（mantan / AI の両方）。
  # ★never_cast も明示的に付ける（2026-07-26）。
  #   irreversible は「戻せない」という**事実**の記録で、
  #   never_cast は「選ばない」という**方針**。意味が違うので両方書く。
  #   DQ2:spell_denied() はどちらでも拒否するので、片方を書き忘れても止まる。
  0x14: { name: Return,    mp_field: 6,  irreversible: true,
          never_cast: true, never_cast_reason: 唱えると町へ飛ばされ戻せない }
  0x15: { name: Open,      mp_field: 2 }
  0x16: { name: Stepguard, mp_field: 4 }
  0x17: { name: Revive,    mp_field: 15 }

# --- 敵の表（名前・ステータス・行動・ドロップ・経験値）--------------------
#
# ★★ ここには**入っていない**（RX-0090 / 2026-08-21）★★
#
#   monsters / monster_stats / monster_behavior / action_rates / exp_to_level は
#   起動のたびに**利用者の ROM から読んで**この表に足される:
#     読み方（位置・バイト配置）… dq2rom/enemies.py
#     足す係・キャッシュ        … retroux/core/enemy_tables.py
#                                 （work/generated/enemy_tables.json）
#   ★値はゲームのデータそのものなので、配布物に複製を置かない。
#     ⚠ 2026-07-26〜27 に抽出した静的表と全項目一致することを確かめてから消した
#     （tests/test_enemy_tables.py）。
#   ⚠ ROM が無い環境では足されない。図鑑は「データがありません」、
#     Lua 側は 未知(0x..) と「効くと決めない」耐性扱いに落ちる（以前からの道）。
#
# 残しているのは**構造の知識**（相互運用情報）だけ:
#
# ・敵ID … 0x01〜0x53 の 83 体。★ボス(0x4E-0x52)は config.yaml の boss_monster_ids（DEV-8）。
#
# ・耐性（monster_stats.resist の 6 値。0〜7）… 2026-07-26 / Phase 6 P4-0
#     効くかどうか … rand(0..6) >= 耐性値 なら成功 → **成功率 = (7 - 耐性値) / 7**
#     0 = 必ず効く / 7 = **絶対に効かない**（完全耐性）
#     rand が 0..6 であることは乱数ルーチン B04_A020 で確かめた（マスク7、7以上は引き直し）。
#     ⚠ 逆アセンブルのコメント「between $03 and A」は**誤り**。0 以上 A 未満。
#   どの呪文がどの耐性を見るか（bank4.asm:6115-6215 の分岐で裏取り）:
#     0x02 ラリホー -> sleep / 0x04 ザラキ -> defeat / 0x06 マホトーン -> stopspell
#     0x07 マヌーサ -> surround / 0x08 ルカニ -> defense_down
#     0x01 ギラ・0x03 ベギラマ・0x05 イオ・0x0E イオナズン -> spell_damage
#     ⚠ 0x0C メガンテ は**耐性判定を通らない**（ただし敵ID >= 0x4E のボスには無効）
#   ★裏取り: 公開データ（極限攻略 FC版）と 11体 × 6耐性 = 66項目すべて一致。
#
# ・回避率（evade）… 命中判定は rand(0..63) < evade で回避。
# ・gold は「最大」ゴールド。実際のドロップは乱数で減る。
# ・exp_to_level … 「そのレベルに到達するのに必要な**累計**経験値」（ROM は増分、足し込む）。
#   ⚠ ムーンブルクの LV30 以降は表に無い +65536 がコードで加算される。表どおりの値。
#
# ★AI は初遭遇のモンスターにもこの知識を使う（2026-08-22 / RX-0096）。
#   ⚠ ここには「使わない（P6-3）」と書いてあったが、実装は最初から使っていた。
#   依頼者の判断で B案（常に使う）に決め、文書を実装に合わせた。初遭遇の戦闘は
#   そもそも等速＋手動なので、効くのは「2体目以降に初遭遇が混ざる戦闘」だけ。

# --- 敵の行動（2026-07-27 / モンスター図鑑の作り直しで追加）------------
#
# ★★ 4ビットの値 -> 行動名の対応表。**82体すべてで公開データと一致した** ★★
#
# 仕組み（bank4.asm:8078 B04_B078 の実コード）:
#   1. ステータス表 +7 の上位2ビット = 「賢さ」（0〜3）
#   2. 賢さで確率表（action_rates）を選ぶ
#   3. 乱数 rand(0..255) を取り、**最初に 表[i] >= rand となった i** が行動枠
#   4. どれも満たさなければ i = 7  ← ★枠は 8 つ（7 と数えて外した）
#   5. 枠 i の値 = +10〜+13 の 4ビット（偶数枠=上位 / 奇数枠=下位）
#                 + (+14 の 枠i ビット) を上位ビットとして合成 = 5ビット
#
# ★対応表の解き方（推測ではない）:
#   ROM からは各枠の確率が小数まで正確に出る。公開データは「行動名 -> 確率」。
#   **確率を鍵にして連立**させると 30種類が一意に決まった。
#   残る 0x04 と 0x1E は、0x1E のぶんが**比例配分され直している**ことから
#   0x1E = 選び直し / 0x04 = 防御 と確定した。
#   最終検算: **全82体で行動の集合と確率がすべて一致**（research/probes/archived/solve_actions.py --verify）
#
# ⚠ 0x1E は**有効な行動ではない**（引いたら選び直す）。
#   コード側にも裏がある: B04_B06E が上限100回の選び直しループ。
#   確率を出すときは 0x1E を除いて正規化すること。
#
# 出典の公開データ: ワールド9「モンスター(敵)データ - ドラクエ2[FC版]」
#   https://retro-video-game.com/guide/fc/dragon-quest-2/data/enemy
monster_actions:
  0x00: 通常攻撃
  0x01: 痛恨攻撃
  0x02: 毒攻撃
  0x03: 眠り攻撃
  0x04: 防御
  0x05: 逃げる
  0x06: ギラ
  0x07: ベギラマ
  0x08: イオナズン
  0x09: ホイミ(自)
  0x0A: ベホイミ(自)
  0x0B: ベホマ(自)
  0x0C: ホイミ
  0x0D: ベホイミ
  0x0E: ベホマ
  0x0F: ザオリク
  0x10: ルカナン
  0x11: スクルト
  0x12: ラリホー
  0x13: マホトーン
  0x14: マヌーサ
  0x15: ザラキ
  0x16: メガンテ
  0x17: 炎(弱)
  0x18: 炎(中)
  0x19: 炎(強)
  0x1A: 毒の息
  0x1B: 甘い息
  0x1C: 仲間を呼ぶ
  0x1D: ２回攻撃
  0x1E: 選び直し   # ★有効な行動ではない（選び直し）
  0x1F: 不思議な踊り

# ★action_rates（賢さごとの8枠の確率）も ROM から読む（PRG の 28 バイトのしきい値表）:
#     P(枠0) = (表[0]+1)/256 / P(枠i) = (表[i]-表[i-1])/256 / P(枠7) = (255-表[6])/256
#   賢さが高いほど枠0（いちばん強い手）に寄る。
# ★monster_behavior（各敵の賢さと8枠の行動）も同様。表示は action_rates と組み合わせ、
#   **0x1E を除いて正規化**して出す。

# --- 文字コード表（2026-07-29 に解読）----------------------------------
#
# ★★ **CHR-RAM の字形を目で読んで起こした。推測ではない。** ★★
#   セーブステートの `CHRR` チャンク（8KB = 512タイル）を PNG に描いて読んだ
#   （手順は `docs/how-to-read-rom.md` 5章）。
#
# 裏取り:
#   ・敵の名前83体が、既に分かっていた9体と **9/9 一致**（未解決コード0）
#   ・道具61件が、既に分かっていた6件と **6/6 一致**
#   ・キャラ名の先頭 `0A 0F 31 5F` が「あかり␣」と読める（以前からの観測と一致）
#
# ⚠ **FC のフォントは字数が少なく、無いカタカナは平仮名で代用されている。**
#   カタカナのリ・ベ・エ などが無いので「べりアル」「りビングデッド」「マりア」
#   と表示される。**画面に出るとおり**なので直さないこと。
text:
  # 連続して並んでいる文字（先頭コード: 並び）
  runs:
    0x00: "0123456789あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんっゃゅょアイオカキクコサシスタテトナウヌハヒフホマミムメモラルレロン"
  # 単独の文字
  single:
    0x5F: "␣"        # 空白
    0x7F: "ー"        # 長音
    0x80: "じ"
    0x81: "だ"
    0x82: "ぶ"
    0x8A: "ッ"
  # 直前の文字に付く記号
  dakuten: 0xEE       # 濁点（シ+EE = ジ）
  handakuten: 0xEF    # 半濁点（ホ+EF = ポ）
  # 文字列の区切り
  separator: 0xFA
