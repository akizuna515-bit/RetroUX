    #   実測（サマルトリア LV9 / MP31）:
    #     (列0,行0) -> 0x0A 敵を狙う
    #     (列0,行1) -> 0x0A 敵を狙う
    #     (列1,行0) -> 0x0B ★味方を狙う（回復系の候補）
    #     (列1,行1) -> 項目なし（カーソルが動かない）
