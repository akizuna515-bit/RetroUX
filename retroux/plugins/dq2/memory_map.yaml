  0x08:                       # 戦闘中の「どうぐ」（持ち物）
    name: 戦闘中のどうぐ
    # ★フィールドの持ち物(0x15)とは**別のID**（実測 work/staff/probe.txt）。
    #   呪文リストが 0x14 -> 0x07 で別だったのと同じ形。
    #
    # ★★ 2列メニュー ★★ cursor_x が意味を持つ（0 で、255 ではない）。
    #   ⚠ 最初の観測で**縦方向しか調べず**「行0〜2 しか無い」と誤って結論した。
    #     0x07（戦闘中の呪文リスト）で同じ穴を踏んで教訓に書いたのに繰り返した。
    #     **cursor_x が 255 でなければ複数列**。必ず横も調べる。
    #
    # ⚠ **行番号と持ち物の並び順が一致しない。**
    #   実測: まどうしのつえ は持ち物の**行3**にあるが、
    #   縦方向では行0〜2 しか到達できなかった（列1が未調査）。
    #   戦闘中は「戦闘で使える道具だけ」に絞られている可能性もある。
    #   $0081 は 4 を返した（複数列では項目数ではない。0x07 と同じ）。
    #
    # ★★ 位置と持ち物の対応（2026-07-25 実測で確定 / work/staff/map.txt）★★
    #
    #   **持ち物の行 = カーソル行 * 2 + カーソル列**（行優先 / 2列）
    #
    #   絞り込みは無い。持ち物と同じ内容が同じ順で2列に並ぶだけ。
    #   実測: ムーンブルクの持ち物6個 -> 2列×3行 = 6箇所すべて到達できた。
    #
    #   確定のしかた（**アイテムを1つも消費していない**）:
    #     フィールドの持ち物 0x15 は「行 = 持ち物の並び順」と確定しているので、
    #     同じ実行の中で 0x15 と 0x08 の**画面のタイルを採って突き合わせた**。
    #     字形の対応表を作らずに、位置と持ち物を一致させられる。
    #       (列0,行0) 20 22 22 25 11       = 持ち物の行0
    #       (列1,行0) 2D 11 18 0C          = 行1（やくそう）
    #       (列0,行1) 17 0B 1E 32 49 3D 4E = 行2
    #       (列1,行1) 28 1D 0C 15 22 1B 0D = 行3（まどうしのつえ）★
    #       (列0,行2) 10 37 22 3F 40       = 行4（きんのカギ）
    #       (列1,行2) 58 48 22 15 32 15    = 行5（ロトのしるし）
    #
    # ⚠ 位置を推測して押すと**別の道具を使ってしまう**。
    #   実際に踏んだ: (列0,行2) を杖だと思って押したが**きんのカギ**だった。
    #   何も消費されず敵が倒れたので「杖が倒した」と読んでしまったが、
    #   倒したのは他の2人の攻撃だった。**杖は在庫が減らないので、
    #   在庫の変化では「本当に杖を使えたか」を検証できない。**
    #   検証には別の効果（敵のHP/数の変化など）を使うこと。
    multi_column: true
    columns: 2
    row_source: inventory          # 持ち物と同じ内容・同じ順（絞り込み無し）
    # 位置から持ち物の行を求める式。実装はこれを使う（推測しない）
    index_formula: "row * 2 + col"

