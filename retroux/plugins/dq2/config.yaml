# DQ2 プラグイン設定
# 仕様: docs/design/mvp1-spec.md / 指示書からの変更点: docs/design/deviations-from-instruction.md

# ★★ 設定スキーマの版（2026-08-07 / 戦闘AI再設計 Phase 10）★★
#
#   ⚠⚠ **知らない版を黙って読まない。** 将来 DQ3 などを足すとき、
#     古い形の設定をそのまま読むと「効いているつもりで効かない」
#     という、いちばん気づきにくい壊れ方になります。
#   ★形を変えたらこの数を上げ、読む側の対応も同じコミットで直します。
schema_version: 1

speed:
  # 通常戦闘の倍率。FCEUX Lua に倍率指定は存在しないため、
  # maximum で走らせて Lua 側で自前スロットルする（DEV-2）。
  # 速度の実現方式:
  #   turbo     : FCEUX 標準の早送り。倍率は指定できないが描画・音声・入力が正常。既定
  #   throttled : 自前スロットル。**任意倍率をぴったり作れる**が、
  #               過去の実機確認では【実際には遊べない】と判定された
  #               （画面が真っ暗・音がノイズ・入力が処理されない）
  #
  # ★B-8 の実測（2026-07-25 / work/b8/probe.txt）:
  #   素の速度   normal 0.99倍 / turbo 38.1倍 / nothrottle 38.8倍 / maximum 37.4倍
  #   自前スロットルを噛ませると **狙った倍率がぴったり出る**（誤差 ±0.0%）:
  #     2.00倍 / 4.00倍 / 8.00倍 … 土台が maximum でも nothrottle でも turbo でも同じ
  #   -> **倍率は数値としては完全に実現できる。** speed_profiles の
  #      8.0 / 2.0 / 1.5 といった指定はそのまま作れる。
  #
  # ⚠ 残るのは「その倍率で**遊べるか**」だけで、これは Lua からは測れない。
  #   ビジーウェイト中に FCEUX の描画・音声・入力処理が止まることが原因であり、
  #   エミュレータの内側の話だから。**実際に触って判断するしかない。**
  #   （最初の測定では画面の画素変化を見たが、等速でも「変化なし」と出た。
  #     静止画面では絵が変わらないだけで、描画の有無は測れていなかった）
  #
  # ★★ B-8 は決着（2026-07-26 / 2回目の実機確認）★★
  #
  #   throttled で実際に遊んでもらった結果、依頼者の報告:
  #     「emulation speed 6400%が出たね」
  #     「画面は真っ暗で、これだと前のほうがましかなあ」
  #
  #   同時に測った実効速度（work/throttle_actual.txt）:
  #     フィールド 1.01倍 / 戦闘 **4.00倍ちょうど** / 安全弁の作動 0件
  #
  #   -> **倍率は正確に作れている。しかし遊べない。** 2026-07-22 の判定が再現した。
  #      「4.0 が 64倍と誤認された」のでも「前のままだった」のでもない。
  #      6400% は FCEUX 自身の表示（土台の maximum のこと）で、実効速度ではない。
  #
  #   原因: 目標フレームまで Lua がビジーウェイトする間、
  #   FCEUX の描画・音声・入力処理がすべて止まる。
  #   **エミュレータの内側の話なので Lua からは回避できない。**
  #
  #   ★結論: **任意倍率は FCEUX Lua では実現できない。**
  #     speed_profiles の 8.0 / 2.0 / 1.5 のような指定は**実装できない**。
  #     使えるのは speedmode の4値だけ（実質 normal と turbo の2段）。
  #     この道はもう試さないこと。2回とも同じ結論に達している。
  #
  #   ⚠ throttled は**検証用途のみ**。既定に戻してはいけない。
  mode: turbo
  battle_multiplier: 4.0
  normal_multiplier: 1.0

  # 自動操作（まんたん等）の実行中の倍率。
  # まんたんは1回あたり約420フレーム（7秒）かかり、その中身は
  # メニュー送りとメッセージ待ちだけ = **待ち時間そのもの**。
  # 利用者が明示的に要求した操作であり、難易度や判断には関わらないため倍速にする。
  # ★戦闘に入った場合は通常の戦闘判定（危険/初遭遇/ボス）を優先する。
  #   自動操作で安全判定を上書きしてはいけない。
  # 0 または 1.0 にすると等速で実行する。
  action_multiplier: 4.0

  # 倍速の適用範囲。true なら勝利メッセージが終わるまで継続する（DEV-4 / C-6）。
  include_victory_message: true

  # 倍速中の音声について（C-5 解決 / 2026-07-25）
  #
  # ここに設定項目は置かない。FCEUX Lua には音声制御 API が存在せず
  # （emulib[] に sound/mute 関連の関数がない）、実装できない。
  #
  # 実際には **FCEUX 自身が対応済み**。turbo モードは muteTurbo 設定が有効なとき
  # 音声をバイパスする（FCEUX ソース lua-engine.cpp のコメントに明記）。
  # tools/fceux/fceux.cfg に `muteTurbo 1` が入っているため、倍速中は無音になる。
  # 音を鳴らしたい場合は FCEUX 側の設定（Config > Sound）を変更する。

# --- 演出を尊重した等速復帰 -------------------------------------------
#
# 反復作業は速くしたいが、**達成感のある演出まで速くしたくない**。
# レベルアップが一瞬で流れると、嬉しさごと削ってしまう。
#
# ★B-8 が決着したため速度は normal と turbo の2段しか使えない
#   （任意倍率は FCEUX Lua では遊べる形で実現できない）。
#   バックログの speed_profiles（通常戦闘8倍/ボス2倍…）は実装できないが、
#   **「この瞬間だけ等速に戻す」という中核は2段でも成立する。**
#   諦めるのは刻みの作り分けだけ。
#
# ⚠ いま入っているのは**RAMから確実に読めるものだけ**。
#   レアドロップ・ふくびきの当たり・会心の一撃は検知手段が未特定なので
#   実装していない（憶測でイベントを作らない）。見つかったら足す。
speed_events:
  enabled: true
  # 等速を保つフレーム数（60で1秒）。
  # ★本当は「演出の終わりを検知して解除」したいが、終わりの判定が未特定。
  #   固定時間は次善。長すぎると待たされ、短すぎると演出を削る。
  hold_frames: 240          # 4秒
  # ★レベルアップだけは長く保つ（RX-0070 / 依頼者「早戻しが早い」）。
  #   ステータスアップ・呪文習得の表示まで通常速度を保つため。60で1秒。
  #   ⚠ 演出の終わり判定が未特定なので固定時間。長すぎても数秒待つだけ。
  level_up_hold_frames: 600 # 10秒（★複数の呪文を覚えても届くように）
  # レベル値($063E + 添字*0x12)の増加で検知する。警戒リスト解除で実績のある読み方。
  level_up: true
  # 生存者数の減少で検知する。
  member_death: true
  # ★強制AUTO 中は等速に戻さない（既定 true）。
  #   強制AUTO は利用者が「いま速くしたい」と明示した場面なので、
  #   自動判断でそれを覆さない。false にすると強制AUTO 中でも等速に戻す。
  respect_force_auto: true

danger:
  # 危険状態の定義（DEV-5 / C-3）。いずれかを満たすと倍速解除＋自動入力停止。
  # 「死亡者が1人でもいたら危険」にはしない。DQ2 は蘇生が高価で、
  # 1人死亡のまま冒険を続けるのが通常のプレイであるため。
  hp_ratio_threshold: 0.25    # 生存者の誰かが 現在HP <= 最大HP*0.25
  min_alive_members: 2        # 生存者がこれ未満（=1人）になったら危険
  # 毒を危険扱いにするか。★false（依頼者の判断 / 2026-07-25）
  #
  # 理由: DQ2 の毒はフィールドを歩いたときのスリップダメージで、量も小さい。
  # 戦闘の危険度に直結しないため、これで倍速と自動戦闘を止める必要がない。
  # 止めていると毒のあいだ延々と等速になり、待ち時間を削る目的に反する。
  #
  # 毒でも守りは残っている: スリップダメージでHPが減れば
  # hp_ratio_threshold（25%以下）で危険と判定され、等速＋手動に戻る。
  # ★眠りは危険判定に入れていない。
  #   ⚠ 2026-08-12 訂正: ここには「眠りのビットは**未特定**」と書いてありましたが、
  #   ビット位置は 2026-07-26 に判明しています（`memory_map.yaml` status_bits.sleep = 0x40 /
  #   逆アセンブル bank4.asm:5077 の構造体表）。★入れていない理由は「未特定だから」ではなく
  #   **実測がまだ**だからです（敵に眠らされる場面を作れていない / B-10）。
  #   ⚠ 裏が取れたら、ここに入れるかどうかは別途決めます。
  treat_status_as_danger: false

auto_input:
  # MVP1 で入力するコマンドは「たたかう」のみ（指示書）
  #
  # ⚠ 既定で無効にしている（2026-07-22）。
  # B-7は解決済み。安全のため自動入力は引き続き明示的に有効化する。
  # 倍速・危険状態の検知・記録は自動入力なしでも動作するため、
  # 「戦闘は手動、待ち時間だけ倍速で削る」形なら今すぐ実用できる。
  # 検証したい場合のみ true にすること。
  enabled: true
  command: fight
  target_characters: all      # 3人全員に入力する（DEV-6 / C-4）
  disable_when_danger: true
  disable_when_first_encounter: true
  disable_when_boss: true

  # ★前に逃げた/負けた相手（警戒リスト）では自動入力を止める。
  #
  # 遭遇済みの登録は戦闘開始時に行うため、**逃げた相手も遭遇済みになり**
  # 次回は倍速＋自動たたかうが有効になっていた。しかし自動入力は
  # 「たたかう」しか押さないので逃げるという選択ができない。
  # 「勝てないから逃げた」相手に自動で殴りかかることになり、
  # DEV-8（ボスに敗北後の再戦）と同じ穴だった。
  #
  # 実ログでは141戦闘のうち34戦が勝利表示なし（逃走/敗北）で、
  # その相手（Big Cobra など）はすべて遭遇済みに入っていた。
  #
  # 逃げるのはプレイヤーの難易度判断。自動戦闘で上書きしない（ビジョン）。
  # その相手に勝った時点で解除する（もう勝てるのだから倍速でよい）。
  # 一覧は work/caution.txt。消せばリセットされる。
  disable_when_caution: true

  # ★一度手動へ落ちたら、その戦闘の間は手動のままにする（既定 true）。
  #
  # 依頼者の報告:
  #   「ホイミで回復するとオートモードが復活し、いつまでもリビングデッドから
  #     たたきにいっちゃう」
  # 危険状態はHPが戻ると解除されるため、回復した瞬間に自動戦闘が復活して
  # 同じ敵を殴りに戻っていた。プレイヤーが作戦を変えて戦っている最中に
  # 勝手に主導権を取り返すのは筋が悪い。
  # 一度操作を返したら、その戦闘が終わるまで返したままにする。
  latch_manual_for_battle: true

  # --- 倒す順の優先指定（作戦）-----------------------------------------
  #
  # ここに書いたモンスターIDを**先に**攻撃する。上から優先。
  # 依頼者の指定: ヒーラー（ホイミスライム）から倒す。
  #   回復役を残すと、こちらの与えたダメージを回復し続けて決着しない。
  #
  # 敵IDは実際の戦闘記録（events.jsonl）から特定:
  #   [18, 6, 6] = Zombie, Healer, Healer
  #   0x12 リビングデッド / 0x06 ホイミスライム（ヒーラー）
  # --- 無駄撃ちを避ける（2026-07-31 / 依頼者の要望）---------------------
  #
  # > 攻撃のときに、敵モンスターの残りHPを予測して、無駄な攻撃をしない
  # > → 今は、左の敵に総攻撃をしている
  #
  # DQ2 は3人ぶんのコマンドを**先に入れてから**まとめて実行するので、
  # 全員が同じ敵を狙うと**倒れたあとの攻撃が空振り**する。
  # このターンで割り当てた見込みダメージを覚えておき、
  # 足りているグループは飛ばして次の敵へ回す。
  overkill_avoid: true
  #
  # ⚠⚠ **見込みダメージは「目安」**（公開されている近似式
  #   `(こうげき力 - しゅび力/2) / 2`。ROM の計算は追っていない）。
  #   外したときの向きが違うので、係数で安全側へ倒せるようにしてある:
  #
  #   | 係数 | 動き |
  #   | --- | --- |
  #   | 1.0 | 目安どおり。**無駄は最小**だが、たまに倒しきれない ★依頼者の指定 |
  #   | 1.2〜1.5 | 少し多めに殴る。取りこぼしにくいが無駄が残る |
  #
  # ★「倒しきれずに次のターンへ持ち越す」が目立つようなら上げること。
  overkill_margin: 1.0

  target_priority:
    - 0x06   # ホイミスライム（Healer）。回復役なので最優先で倒す ★依頼者の指定
    # ⚠ 0x0A は まほうつかい（Magician）で、**回復役ではない**。
    #   当初「回復する敵」として並べていたが誤り（名前を確認して訂正）。
    #   ラリホーで眠らされると一方的に殴られるため先に倒す価値はあるが、
    #   依頼者が指定したのは「ヒーラーから倒せ」なので、これは追加の判断。
    #   不要なら消してよい（消しても ヒーラー優先は効く）。
    - 0x0A   # まほうつかい。眠らされる前に倒す（ヒーラーの次）

  # --- 行動の優先順（Phase 6 P5 / 依頼者の項目1・7）---------------------
  #
  # > 回復優先／攻撃優先
  # > リソース維持優先（MPを消費しない行動を優先）
  #
  # ★上から評価し、**最初に成立したものを実行する**（FF12 のガンビットと同じ形）。
  #   どれも成立しなければ「たたかう」。**たたかうは常に最後**なので書かない。
  #
  # ★★ 並べ替えだけで作戦を表現する ★★
  #   「回復優先」「リソース維持優先」を別々の分岐として書くと、
  #   組み合わせの数だけ経路が増えて検証できなくなる。
  #   **判断の中身は変えず、順番だけを変える**（仕様書 4.1）。
  #
  # 使える名前（これ以外を書くと起動時に警告して既定の順を使う）:
  #   heal   … 回復呪文（P3 / MPを使う）
  #   item   … 戦闘中の道具（杖など。**MPも在庫も使わない**）
  #   target … 敵選択メニューで倒す順の優先指定へ寄せる（DEV-19）
  #
  # ⚠ target は「行動を決める」ものではなく「対象を選ぶ」もの。
  #   heal / item が成立しなかったときにだけ意味を持つので、**必ず最後**に置く。
  #   前に置くと、敵選択の画面で回復の判断が回らなくなる。
  #
  # 既定は下の [heal, attack, item, target]。
  # ⚠ 2026-08-12 訂正: ここには「既定 **[heal, item, target]**」と書いてありましたが、
  #   ★2026-08-03（攻撃呪文を bridge へ繋いだとき）に `attack` が入り、
  #   **コメントだけが P3 のまま**残っていました。値のほうが正です。
  # リソース維持優先にするなら [item, heal, target]
  #   -> 杖で足りる場面ではMPを使わない。杖は在庫が減らないので純粋に得。
  priority: [heal, attack, item, target]

  # --- ★★ 判断エンジンの切り替え（2026-08-04 / 戦闘AI再設計 Phase 1）------
  #
  # 指示書 Phase 1 の完了条件:
  #   > 新旧ロジックの切り替えフラグを用意する
  #
  # ★★ **既定は `legacy`。触らなければこれまでとまったく同じです。** ★★
  #
  #   legacy   … 現行の bridge.lua の判断（★これが本番）
  #   layered  … 三層構造（戦況分析 -> 作戦指示 -> 個人貢献 -> 最終調整）
  #
  # ★★ 2026-08-20: 既定を **layered** にした（RX-0089 / 依頼者）。
  #   layered = legacy の判断 ＋ 拒否層（戦術に反する行動を止める。実装済み・
  #   作者が開発機で常用）。戦況分析が判断に使われ、画面の「⚠ 試験中」も消える。
  #   ⚠ 元の「Phase 2 以降で中身が入ります」という注記は古い（veto は実装済み）。
  #
  # ⚠ 知らない名前を書いたとき・**設定が読めないとき**は
  #   **警告して legacy を使います**（フォールバックは安全側のまま）。
  #   ★黙って別のエンジンで戦わせない（打ち間違いに気づけるように）。
  engine: layered

  # --- ★★ 戦況分析の係数（2026-08-05 / 戦闘AI再設計 Phase 4）------------
  #
  # 指示書 §20:
  #   > 係数をコードへ散在させない / 設定ファイルから調整可能にする
  #
  # ★★ **これは「見立て」の粗い近似です**（指示書 §6.1）。
  #   > 厳密な戦闘シミュレーションは不要。平均値や近似値を使い、
  #   > 十分に説明可能な判断を行う。
  #
  # ⚠⚠ **Phase 4 では見立てるだけで、判断は変えません。**
  #   `engine: legacy` のままなら、これまでとまったく同じ動きです。
  #   ★理由ログに推計値が出るようになるだけです（§18 Phase 4 完了条件）。
  assessment:
    # ★味方1人の1ターンの期待ダメージ（★武器・レベルで大きく変わるので粗い）
    #   ⚠ ROM から個人の攻撃力を読めるようになったら、ここは不要になります。
    party_damage_per_turn: 40

    # ★敵の攻撃力から期待ダメージを見積もる倍率。
    #   ⚠ DQ2 の実ダメージは (攻撃力/2 - 守備力/4) 前後。守備力を読めないので
    #     ★ここでは攻撃力の半分を目安にします（粗いが説明はできる）。
    enemy_damage_ratio: 0.5

    # ★優勢・劣勢の境目（指示書 §6.3）。
    #   敵撃破ターン + margin < 味方崩壊ターン -> 優勢
    #   味方崩壊ターン + margin < 敵撃破ターン -> 劣勢
    #   ⚠ margin が小さいと**毎ターン優勢と劣勢を往復**します（§10 IT-007）。
    balance_margin: 1.5

    # ★戦闘長の分類（指示書 §6.2 / 敵撃破までの推計ターン）
    short_turns: 2      # これ以下なら短期
    long_turns: 6       # これ以上なら長期

    # ★脅威の見方（指示書 §7）。
    #   攻撃優先度 = その敵を残した場合の損失 × 今排除できる可能性
    #   ⚠ 「脅威度順」ではありません。**倒しやすさ**も掛けます。
    #   ★これで「高火力・低HP」が先、「高耐久・低火力」が後回しになります。
    threat:
      # 回復する敵をどれだけ重く見るか（★放置すると戦闘が終わりません）
      healer_weight: 2.0
      # 即死・停止を使う敵の重み
      disable_weight: 1.5

  # --- ★★ 戦術の自動選択（2026-08-06 / Phase 5）------------------------
  #
  # 指示書 §9:
  #   > 戦術は「戦況タグと大目的への適合度」を返すものとして実装する。
  #   ★ユーザーが全組み合わせを手動で紐づける方式にはしない。
  #
  # ⚠⚠ **Phase 5 でも `engine: legacy` なら判断は変わりません。**
  #   ★選んだ戦術をログに出すだけです。実際に効かせるのは
  #     `engine: layered` にしたときだけ。
  # --- 複数回攻撃の武器（2026-08-08 / 依頼者の指摘）---------------------
  #
  # ★★ **はやぶさのけんは2回攻撃**です。⚠ 攻撃力の加算は **+5 だけ**なので、
  #   「こうげき力」だけ見ていると弱く見えます。★値打ちは回数のほうです。
  #
  # ⚠ ROM で確かめました（★推測ではありません）:
  #     `bank4.asm:5654  lda #$49 ; Item ID #$49: Falcon Sword (equipped)`
  #     `bank4.asm:9748  .byte 5  ; Item ID #$09: Falcon Sword`（攻撃力+5）
  #   ★`0x49` は `0x09 | 0x40`。**bit6 が「装備中」**の印です。
  #
  # ⚠⚠ **装備していなければ1回**です（★持っているだけでは増えません）。
  multi_hit_weapons:
    - { id: 0x09, name: はやぶさのけん, hits: 2 }

  # --- 補助行動（2026-08-08 / 指示書 §18 Phase 7・8）---------------------
  #
  # ★★ **推計ターンが何ターン縮む／延びるかで決めます。** ★★
  #
  #   ⚠⚠ いちばん大事なのは「**ターンは整数**」ということです。
  #     2.2 -> 2.09 は、切り上げるとどちらも 3 ターン ＝ **得なし**。
  #     ★これが「短期優勢戦で無意味なルカナンを使わない」の中身です。
  #
  # ⚠⚠ **倍率は近似です**（★指示書も「効果適用後の戦力を近似」と書いています）。
  #   ROM から取った値ではありません。⚠ 出典を各行に書いてあります。
  #   ★実測できたら直してください（そのとき検査の期待値も一緒に）。
  #
  # ⚠ `resist_field` は `memory_map.yaml` の `monster_stats.resist` の項目名です。
  #   ★推測で書かないこと（無い名前を書くと「効くか分からない」で見送ります）。
  #
  # ⚠⚠ **まだ実際の入力には効かせていません。** ★ログに `[補助]` として
  #   出るだけです（Phase 5・6 と同じ段）。
  support:
    # ★既定は **normal**（成功率 50% 以上なら使う）。
    #   disabled … ⚠ 確実なものだけ（成功率100%以外は使わない）
    #   cautious … 75% 以上   normal … 50% 以上   bold … 25% 以上
    risk: normal

    spells:
      # ★ルカナン（Defence / 0x08）。敵の守備を下げる -> こちらの火力が上がる
      #   ⚠ 倍率 1.25 は**近似**。DQ2 の守備力は実ダメージの (守備力/4) にしか
      #     効かないので、★大きく見積もらないこと。
      0x08:
        kind: debuff_defense
        resist_field: defense_down
        our_damage_multiplier: 1.25
        source: 近似（★実測ではありません / 2026-08-08）

      # ★スクルト（Increase / 0x0A）。味方の守備を上げる -> 崩れるまでが延びる
      0x0A:
        kind: buff_defense
        enemy_damage_multiplier: 0.8
        source: 近似（★実測ではありません / 2026-08-08）

      # ★マヌーサ（Surround / 0x07）。敵の命中を下げる
      #   ⚠ 物理攻撃しかしない敵には大きく効き、呪文主体の敵には効きません。
      #     ★いまは区別できないので、控えめな 0.7 にしてあります。
      0x07:
        kind: debuff_accuracy
        resist_field: surround
        enemy_damage_multiplier: 0.7
        source: 近似（★実測ではありません / 2026-08-08）

      # ★ラリホー（Sleep / 0x02）。敵を止める
      #   ⚠ 止めた敵は**狙わない**印を付けます（★殴ると起きるため）。
      #   ★効果は「何体に効いたか」で薄まります（`scale_share`）。
      0x02:
        kind: disable
        resist_field: sleep
        enemy_damage_multiplier: 0.5
        source: 近似（★全部に効いたときの値 / 2026-08-08）

      # ★ザキ（Defeat / 0x04）。即死
      #   ⚠⚠ **通常攻撃で確実に倒せる敵には使いません**（★MPの無駄）。
      0x04:
        kind: instant_death
        resist_field: defeat
        our_damage_multiplier: 1.5
        source: 近似（★全部に効いたときの値 / 2026-08-08）

      # ★マホトーン（Stopspell / 0x06）。呪文を封じる
      #   ⚠ 呪文を使わない敵には無意味ですが、★いまは区別できません。
      #     そのぶん控えめ（0.85）にしてあります。
      0x06:
        kind: silence
        resist_field: stopspell
        enemy_damage_multiplier: 0.85
        source: 近似（★実測ではありません / 2026-08-08）

  tactics_selector:
    # ★★ 振動よけ（指示書 §10 IT-007）★★
    #
    #   いま採っている戦術に、この点数だけ下駄をはかせます。
    #   ⚠⚠ **0 にすると境界で毎ターン往復します。**
    #     「通常速攻 -> 主力維持 -> 通常速攻 …」を繰り返し、
    #     ★どちらの戦術も中途半端に終わります。
    #
    #   ★大きすぎると、戦況が変わっても切り替わりません。
    #     1.0 は「明確な差（2点以上）なら切り替わる」目安です。
    stickiness: 1.0

  # --- ★★ ガンガン行こうぜ（2026-08-03 / 攻撃呪文）--------------------
  #
  # ★★ **既定は無効です。**（設定しなければ、これまでと同じ挙動）
  #
  # 有効にすると、サマルトリアとムーンブルクの攻撃呪文を
  # **組み合わせて**評価し、
  #
  #   ムーン単独で倒せる  -> サマルは同じ敵へ重ねない
  #   2人なら倒せる       -> 両方とも攻撃呪文
  #   2人でも倒せない     -> 期待効果の高い手
  #   どちらでも足りる    -> MP の安いほう
  #
  # を決めます（指示書 §7）。
  #
  # ★★ 2026-08-03 以降、ON/OFF は**作戦設定画面**で決めます ★★
  #
  #   画面 > 作戦設定 > 攻撃・補助 > 「攻撃呪文を使う（ガンガン行こうぜ）」
  #
  #   ★**人ごとに切り替えられます。** サマルだけ ON（ムーンは MP 温存）が
  #     できます。ローレシアは呪文を使えないのでグレーアウトします。
  #   ★既定は **OFF**。触らなければ従来どおり「たたかう＋杖＋回復呪文」です。
  #
  # ⚠⚠ 下の `enabled` は **作戦プロフィールを使っていないとき**の値です。
  #   プロフィールがあれば、そちらの値が勝ちます（画面の表示と挙動を
  #   一致させるため）。★つまり画面を使う人は、ここを触る必要はありません。
  #
  # ⚠ `priority` への `attack` の追記は**不要になりました**（既定に入ります）。
  #   以前は priority にも書く必要があり、「画面で ON にしたのに動かない」が
  #   起きる形でした。★入り口は画面のチェック1つに絞ってあります。
  #
  # ⚠⚠ **回復呪文は攻撃候補に入りません**（指示書 §5）。
  #   HP が減ったら既存の「危険時手動復帰」が人へ操作を返します。
  #
  # ⚠ 次のものは候補になりません（★黙って外さず、画面に理由が出ます）:
  #   ・威力が分かっていない呪文（マホトーンなど）
  #   ・唱えない指定（メガンテ・パルプンテ）
  #   ・MP が足りない（★予約ぶんを含めて見る）
  #   ・マホトーンで封じられている
  attack_spells:
    enabled: true

  # ★戦闘の敵選択メニューのID。**0x0A で確定**（2026-07-25 / P0 観測）。
  #   根拠 work/battlemenu/p0.txt: 「たたかう」を決めた直後に 0x0A が出て、
  #   行数が敵グループ数と一致した（よろいムカデ×1 / キングコブラ×1 -> 2行）。
  #   down で 行0 -> 行1 と動き端で止まり、決定すると次の人の入力へ進んだ。
  #
  #   実機で寄せが働くことも確認済み（work/battlemenu/target_test.txt）:
  #   3人パーティの13回の決定すべてで優先指定の行が選ばれた。
  #
  # null に戻すと「行数が敵グループ数と一致する画面」という緩い条件になる
  # （メニューIDを確定できていない環境向けの保険）。
  target_menu: 0x0A

  # --- 戦闘中に杖を使う（依頼者の要望 / DEV-24）-------------------------
  #
  # > まどうしの杖、イカヅチの杖を持っていたらAUTO戦闘で使ってほしい
  # > まどうしの杖、いかづちの杖は減らない。
  #
  # ★「戦闘中の道具は使わない」という決定の理由は
  #   「ゴールドで買った在庫が減る」ことだった。**杖は減らないので理由が
  #   当てはまらない**（DEV-24）。消費資源ゼロなので難易度にも触れない。
  #
  # 実測で確定した経路（work/staff/map.txt）:
  #   0x09 戦闘コマンド 行3「どうぐ」（★全員共通なので安全）
  #     -> 0x08 戦闘中のどうぐ（**2列メニュー**）
  #        **持ち物の行 = カーソル行 * 2 + カーソル列**（行優先）
  #        例) まどうしのつえ が持ち物の行3 -> (列1, 行1)
  #
  # ⚠ 位置を推測して押すと**別の道具を使ってしまう**。
  #   実際に (列0,行2) を杖だと思って押したら きんのカギ だった
  #   （画面に「マリアは きんのカギを つかった。」と出た）。
  #   必ず上の式で持ち物の行から求めること。
  #
  # ★検証は在庫ではできない（減らないため）。
  #   **メッセージに出るアイテム名のタイル列**を照合して確かめる。
  # --- 戦闘中の回復呪文（P3 / 仕様 docs/design/ai-batchiri-spec.md 4章）------
  #
  # > 誰かの HP < 最大HP × threshold で、いま入力待ちの人が回復呪文を使えるなら
  # > **最も減っている人**に回復呪文。それ以外は「たたかう」。
  #
  # ★決めごと（仕様9章）:
  #   ・使うのは**回復呪文だけ**（heal_only）。攻撃呪文は P4。
  #   ・戦闘中の道具は使わない（杖は例外。減らないため / DEV-24）。
  #   ・危険状態(HP 25%以下)になったら AI ごと止まって手動に戻る。
  #     だから threshold は 0.25 より**手前**でなければ意味がない。
  #
  # ★★ 行番号を書かない ★★
  #   呪文は**ID**で指定する。呪文リスト(0x07)のどこに出るかは
  #   習得済みビット($0618)から計算する（根拠は ROM / memory_map の
  #   learned_spells）。覚えて並びが変わっても、人が違っても追従する。
  #   計算できない・味方を狙う呪文でないと分かったら**何もしない**（殴る）。
  #
  # ⚠ 以前は ホイミ(0x09) だけだった。実測で効果を確かめてある唯一の呪文
  #   だったため（ROM では回復呪文だと分かっているが、推測を入れないため）。
  #
  # ★★ Healmore(0x0B) を足した（2026-08-04 / 依頼者の判断）★★
  #
  #   ⚠⚠ **足さないとムーンブルクが戦闘で一度も回復できない。**
  #     実機ログ（2026-08-04 19:51〜19:59）で毎ターン出ていた:
  #
  #       回復呪文を使いません: moonbrooke は設定した回復呪文を覚えていない
  #
  #     ★ムーンブルクはホイミを覚えない（Healmore から習得する）。
  #     このため「いのちをだいじに」の前提（サマルとムーンが回復を担当する）
  #     が半分しか成立せず、二重回復防止も一度も働いていなかった。
  #
  #   ★実機で効果を確認済み（同じログのまんたん / フィールド）:
  #       HP 109 -> 176（+67）/ MP 138 -> 133   moonbrooke の Healmore
  #       HP 176 -> 218（+42）
  #       HP 250 -> 297（+47）
  #
  #   ⚠ ただし上は**フィールドでの実測**。戦闘メニュー（0x07 の呪文リスト）
  #     経由でも同じかは**未確認**。呪文の効果自体は同じなので通るはずだが、
  #     ★次の戦闘で `回復を確認: moonbrooke の Healmore -> ...` が出るかを
  #     見て確定させること。出なければここを戻せばよい。
  #
  #   ★並び順に意味がある。ホイミを先に書くのは「足りるなら安いほう」。
  #     不足HPに対する選び方は `_plan_battle_heal` が上から順に見る。
  heal:
    enabled: true
    # ★★ `expected_heal` は**二重回復を避ける**のに要ります ★★
    #   （2026-08-04 / 戦闘AI指示書 §11 / Phase 0 の回帰ハーネスが発見）
    #
    #   ⚠⚠ これが無いと予約量が nil になり、`_reserve_heal` が
    #     **黙って何もしません**。サマルが回復したのにムーンも同じ人を
    #     回復する、が起きます（★ハーネスで実際に再現しました）。
    #
    #   ★値は ROM の逆アセンブルから取った確定値（推測ではありません）。
    #     `work/dq2-disasm/src/us/prg/bank6.asm` B06_8BD3 付近:
    #       ホイミ   (Spell $09) -> ldx #$40 = 64  -> 実効 32（power/2）
    #       Healmore (Spell $0B) -> ldx #$64 = 100 -> 実効 50（power/2）
    #     ★まんたん側（下の `mantan.methods`）と同じ数字です。
    #
    # ⚠⚠ **実測は 52〜75 でした**（2026-08-08 / 実機8件）★まだ直していません
    #
    #   実測（`work/retroux.log` の「回復を確認」）:
    #       52 55 57 59 64 66 69 75    ← ★Healmore（設定は 50）
    #     （+108 が1件あるが、★同じターンに2回入ったものと見られる）
    #
    #   ⚠ ROM の `ldx #$64`（=100）は**威力**で、実際は
    #     `B0F_D146`（heal by **random** amount）が量を決めます。
    #     ★その番地は逆アセンブル対象外（bank F）で、**式を確かめられません**。
    #     50〜75 なら `power/2 + rand(0..power/4)` に合いますが、
    #     ⚠ 8件では言い切れません。**推測で書き換えない**（原則どおり）。
    #
    #   ★いまの 50 は**少なめ**なので、安全側に外れています:
    #       呪文選び     … ⚠ 強いほうを選びがち（★依頼者の要望と同じ向き）
    #       二重回復よけ … ⚠ 予約が小さく、たまに二重回復しうる
    #
    #   ★直すなら、まず実測を 30 件ほど貯めてください。
    spells:
      - { id: 0x09, name: ホイミ, expected_heal: 32 }
      - { id: 0x0B, name: Healmore, expected_heal: 50 }
    # 回復を始めるHPの割合（最大HP × これ を下回ったら回復）
    threshold: 0.5
    # 1戦闘で唱える回数の上限（暴走の歯止め）
    max_uses_per_battle: 8
    # 1人1ターンで押してよい回数の上限。
    # ★押しても画面が進まないときの歯止め（playbook #9）。
    #   超えたらその番は諦めて従来どおり「たたかう」に戻る。
    max_presses_per_turn: 16
    # カーソルを寄せるときの押下（フレーム）
    seek_hold: 6
    seek_gap: 12
    # メニューが落ち着くまで何も押さないフレーム数（0x07 は特に必要）
    settle_frames: 20
    # 「効いたか」を見張るフレーム数。
    # ★DQ2 は**全員のコマンドを入力してからターンが解決する**ので、
    #   決定した直後に測っても何も変わっていない（P3 の途中経過で踏んだ誤り）。
    #   短すぎると必ず「確認できなかった」になる。
    watch_frames: 1200
    # MPが減ってから**HPが動くまで**の待ち（唱えた後のメッセージ送りぶん）。
    # ★実機で「MPは減ったのにHPは +0」が並んだ（12:47-12:51）。
    #   MPの引き落としとHPの回復は同じフレームではない。
    hp_watch_frames: 600

  battle_items:
    enabled: true
    # 使う道具（上から優先）。id は memory_map の items。
    # ⚠ ここに**減る道具を書いてはいけない**。在庫を勝手に消費してしまう。
    #   減らないと確認できているものだけを書くこと。
    # ★★ 条件（`when`）を書けます（2026-08-01 / 課題 #62）★★
    #
    #   （書かない）           使えるなら常に使う（従来どおり。杖はこれ）
    #   self_hp_below        **使う本人**のHPが `ratio` を下回ったら
    #   enemy_count_at_least 生きている敵が `count` 体以上なら
    #   status_may_land      その状態異常が**効きそうな敵が居たら**
    #
    #   `once_per_battle: true` を足すと、1戦闘に1回だけになります。
    #
    # ⚠ 条件を書かなければ従来と同じ挙動です（既存の設定を壊しません）。
    items:
      #   spell_may_damage     ★呪文ダメージが効きそうな敵が居たら
      #
      # ★★★ **杖は呪文と同じ効果**（2026-08-07 / 依頼者の実機指摘）★★★
      #
      #   > キラーマシーン単体と戦闘。魔道士の杖を使っている？
      #
      #   ⚠⚠ まどうしのつえ＝ギラ、いかづちのつえ＝バギ。
      #     ★攻撃呪文の側は「効かない敵には撃たない」を守っていたのに、
      #       **道具だけ素通り**していました（★「片側だけ」の状態）。
      #   ⚠ 判定は呪文とまったく同じ規則を使います
      #     （`damage_estimate.success_rate`）。
      #   ⚠ 耐性が読めない敵には**これまでどおり使います**
      #     （★読めないことを理由に封じない）。
      #
      # ★★★ **通常攻撃と比べます**（2026-08-08 / 依頼者の指摘）★★★
      #
      #   > サマルではやぶさの剣（2回攻撃）と、魔道士の杖（期待15ぐらい）
      #   > だと、はやぶさのほうが守備力大きい敵以外には期待値高いように思える
      #
      #   ⚠⚠ **そのとおりでした。** それまでは「効く敵が居れば使う」だけで、
      #     ★通常攻撃と**比べていませんでした**。
      #
      #   ★実測に基づく比較（こうげき力100・はやぶさのけん2回攻撃）:
      #
      #       敵の守備力   はやぶさ2回   杖（ギラ相当 期待20）
      #             20        67.5        20   -> ★はやぶさ
      #             60        52.5        20   -> ★はやぶさ
      #            100        37.5        20   -> ★はやぶさ
      #            150        18.8        20   -> ⚠ 杖
      #
      #   ⚠ `expected_damage` は `memory_map.spells` の `damage_avg` と
      #     **同じ数字**にしてあります（★杖は呪文と同じ効果なので）。
      #   ⚠⚠ 物理の式は攻略情報どまりなので、`margin` で余裕を持たせています。
      #     ★1.0 は「互角以上なら道具を使う」。上げるほど通常攻撃に寄ります。
      - id: 0x04
        name: いかづちのつえ
        expected_damage: 25        # ★バギ相当（memory_map の damage_avg）
        margin: 1.0
        all:
          - { when: spell_may_damage }
          - { when: beats_physical }
      - id: 0x03
        name: まどうしのつえ
        expected_damage: 20        # ★ギラ相当（memory_map の damage_avg）
        margin: 1.0
        all:
          - { when: spell_may_damage }
          - { when: beats_physical }

      # --- 装備品（2026-08-01 / 依頼者の実機確認で追加）-----------------
      #
      # ★★ 装備中でも使えます。`_find_battle_item` が bit6(0x40) を
      #   落として探します（いかづちのつえ で実際に踏んだ対策）。
      #
      # ⚠⚠ **効果は依頼者の証言によるもので、ROM では未検証**です。
      #   道具の効果表がまだ解読できていません。
      #   ★思ったとおりに動かなければ、この3行を消せば元に戻ります。

      # 依頼者:「本人へのベホイミなので本人向けの機能」
      #   ★だから `self_hp_below`。⚠ 一番HPが低い**他人**は治せません。
      # ★★ `heals_self: true` は「これは**自分を回復する**道具」という印
      #   （2026-08-04 /「いのちをだいじに」指示書 §9.1）。
      #
      #   ⚠⚠ **条件（`when`）から推測してはいけません。**
      #     `when: self_hp_below` は「いつ使うか」であって
      #     「何をする道具か」ではありません。★別の道具に同じ条件を
      #     書いた瞬間、それが回復道具として扱われます。
      #
      #   ★この印が付いた道具だけが、回復呪文より先に検討されます。
      #     印が無ければ、これまでどおり `item` の順番で使われます。
      # ★`expected_heal` は**二重回復を避ける**のに要ります
      #   （2026-08-05 / 実機ログ 07:27:18-19 で発見）:
      #
      #     戦闘で ちからのたて を使います（samaltria）   ← 本人が自己回復
      #     戦闘で回復します: moonbrooke が samaltria に Healmore
      #
      #   ⚠⚠ 同じターンに samaltria へ**2回回復**していた。
      #     道具の使用が予約されておらず、ムーンブルクは
      #     「samaltria はもう回復する予定」を知らなかった。
      #
      #   ★値は ROM 由来（ちからのたて = 本人へのベホイミ / power 100 の半分）。
      #     `mantan.methods` の Healmore と同じ数字です。
      - { id: 0x1D, name: ちからのたて, when: self_hp_below, ratio: 0.6,
          heals_self: true, expected_heal: 50 }

      # 依頼者:「マヌーサが聞きそうな的には使いたい」
      #   ★`surround` が マヌーサ の耐性（memory_map の monster_stats.resist）。
      #   ⚠ 掛け直しても意味が薄いので1戦闘1回。
      - { id: 0x0E, name: ひかりのつるぎ, when: status_may_land,
          status: surround, once_per_battle: true }

      # いなずまのけん。★依頼者の要望は3段階で細かくなりました（2026-08-01）。
      #
      #   1回目「ローレシアが雑魚多い場合は使いたい」
      #        -> 敵の総数で判断（3体以上）
      #   2回目「もっと厳しくしたい。雑魚が１グループ複数で残っていたら
      #          ぐらいでいいかもしれない」
      #        -> **同じ敵**の数で判断（2体以上）
      #   3回目「敵HPが２０以下で、グループ敵が２体以上みたいな感じじゃないと
      #          逆にうまくいかない」
      #        -> **HP20以下**の敵に限って数える
      #
      # ★★ 狙いは「**1発で倒せる相手が、まとまって残っているか**」。★★
      #   ⚠ 強い敵に全体攻撃を撃つと、削るだけで倒せず1ターン無駄になります。
      #   ⚠ 違う敵が1体ずつなら、何体居ても全体攻撃の値打ちは薄いです。
      #   ⚠ **倒した個体は数えません**（残っている数で判断します）。
      #
      # ★HPは**いま残っている値**を見ます（傷ついた強敵も残り15なら倒せる）。
      #   読めないときだけ、種類としての最大HPで代用します。
      - id: 0x10
        name: いなずまのけん
        when: group_alive_at_least
        count: 2
        max_hp: 20
    # 1戦闘で同じ人が使う回数の上限（暴走の歯止め）
    max_uses_per_battle: 12
    # カーソルを寄せるときの押下（フレーム）
    seek_hold: 6
    seek_gap: 12
    # メニューが落ち着くまで何も押さないフレーム数
    # ★行数や位置は画面が出た直後まだ確定していない（0x0A / 0x07 で実証済み）
    settle_frames: 20

  # 敵選択でカーソルを寄せるときの押下（フレーム）
  # ★hold フレーム押して gap フレーム**離す**。離す期間が要るのは、
  #   押しっぱなしだと次の押下が「新しい押下」として拾われず、
  #   2行以上動かせないため（実測で確認）。
  target_seek_hold: 6
  target_seek_gap: 12

  # 敵選択メニューに入った直後、行数($0081)が敵グループ数と合わない過渡状態が
  # 数フレームある。その間は**何も押さない**で待つフレーム数。
  # ★ここで A を通すと行0（先頭の敵）を確定してしまう。
  #   「メニューIDが変わった＝入力を受け付ける準備ができた」ではない。
  # 待っても合わなければ諦めて従来どおりにする（戦闘が止まる方が害が大きい）。
  target_settle_frames: 20

  # 入力パターン（フレーム単位）: a_hold フレーム押して a_gap フレーム待つ。
  #
  # ⚠ 戦闘のコマンドメニューでは B を押さない。B は「キャンセル」であり、
  # A で選択して B で取り消す ABAB の無限ループになる（B-7 の主因）。
  # 方向キーも押さない。カーソルは「たたかう」から動かない。
  # ★勝利メッセージの送りだけは B を使う（下の victory_button）。矛盾ではない。
  a_hold_frames: 5
  a_gap_frames: 16

  # ★勝利メッセージ中だけ押下を短く・間隔を長くする。
  #
  # 実機ログ（work/postbattle/real.txt）で判明した問題:
  #   勝利メッセージを閉じた A が離される前にフィールドで読まれ、
  #   **戦闘終了の2フレーム後に必ずコマンドメニューが開いていた。**
  #   a_hold=5 のため、メッセージを閉じた後も最大4フレーム A が残る。
  #   開いたメニューを B で閉じるまで113フレーム（約1.9秒）かかっていた
  #   （ゲーム側が戦闘後の遷移中は入力を無視するため）。
  # メッセージ送りは取りこぼしても次の周期で押し直せるが、
  # 押しっぱなしがフィールドへ漏れる方は取り返しがつかない。
  victory_a_hold_frames: 2
  victory_a_gap_frames: 24

  # ★勝利メッセージを送るボタン。A ではなく B を使う。
  #
  # 戦闘のコマンドメニューでは B は「キャンセル」なので押してはいけない（B-7）。
  # しかし勝利メッセージにはキャンセルする対象が無く、B でも送れる。
  #
  # なぜ A を避けるか: メッセージを閉じた A 押下がそのままフィールドの
  # コマンドメニューを開く。ボタンを離しても、入力ラッチ($002F)を空にしても
  # 防げなかった＝ゲーム内部で1回の A が「メッセージを閉じる」と
  # 「メニューを開く」の両方に使われている。
  # フィールドで無害な B で送るのが唯一の解。
  victory_button: B

  # ★強制AUTO のときボス戦も対象にするか。既定 false。
  #
  # 「消化試合」にボスは含まれない。またボス戦での取り違えは
  # 半額ロストや全滅という取り返しのつかない結果になるため、
  # 既定では強制AUTO でもボス戦には効かせない。
  # 画面に FORCE AUTO (boss:off) と出るので、外していることは分かる。
  # 勝てると分かっているボスを流したい場合だけ true にする。
  force_auto_includes_boss: false

  # 戦闘終了直後に全ボタンを明示的に離す期間（フレーム）。
  # 何も送らない（joypad.set を呼ばない）のはプレイヤーに操作を返すためだが、
  # 直前の押下が残っているかを制御できない。ここだけは明示的に断ち切る。
  release_frames_after_battle: 8

  # AI操作OFF の人の番が回ってきた直後、全ボタンを離す期間（フレーム）。
  #
  # ★★ この期間が終わったら **joypad.set を呼ぶのをやめる**（人が押せる）★★
  #
  # ⚠ 0 にしないこと。直前まで AI が押していたボタンが1フレーム残る。
  # ⚠⚠ 大きくしないこと。**その間はキーボードが効かない。**
  #   以前はここが「無期限」だった（ずっと全ボタンを離し続けていた）。
  #   FCEUX の joypad.set で false は「離れている」ではなく
  #   「強制的に離す」なので、人が押しても同じフレームで打ち消される。
  #   見本「手動中心」でキーが一切効かない不具合だった（実機 T-5）。
  manual_release_frames: 8

# --- モンスターの絵を画面から撮る（2026-07-27 / 依頼者の要望）------------
#
# > モンスターグラフィック表示は、データがなかったら画面から取得する論理でいい
# > エミュ画面から、キャプチャを自動的に取れない？
#
# ★取れる。**ROM の絵の形式は未解読**（逆アセンブルも `unknown format` と書いている）
#   だが、このROMは **UNROM = CHR-RAM** なので絵は実行時に PPU へ展開される。
#   画面に出ているものを撮れば、形式を解読しなくてよい。
#
# ★**ファイルが無いときだけ撮る。** 毎戦闘撮ると倍速の邪魔になるし、
#   同じ絵を上書きし続ける意味も無い。遊ぶほど図鑑が埋まっていく。
#
# ⚠⚠ **1種だけの戦闘でしか撮らない。**
#   複数種が並んでいると、画面のどの絵がどの敵かを**画像だけでは決められない**。
#   位置を推測して切り出すと、違う敵の絵を図鑑に載せる。
#   （杖の位置を推測して きんのカギ を使った事故と同じ形 / DEV-24）
#   1種の戦闘は普通に起きるので、それだけで足りる。
#
# ⚠⚠ **1体だけの戦闘でしか撮らない**（2026-07-27 に実測で分かった）。
#   同じ種が複数体並ぶと**画面には全部写る**。実際 よろいムカデ を撮ったら
#   x 16..231（幅216px）で3体並んだ集合写真になった。図鑑の絵には使えない。
#   ★体数の判定は**撮る直前にもう一度やる**。戦闘開始の瞬間は `$0162` の枠が
#     まだ埋まっていないことがあり、「1体だと思ったら3体」が実際に起きた。
#
# ★切り出しの座標は**実測で決めた**（2026-07-27 / research/probes/archived/analyze_art2.py）:
#     画面 256x224 / 背景は純黒 / パーティ枠 y 8..70 / メッセージ枠 y 137..
#     -> **敵の帯は y 71..136**。その中の外接矩形が敵の絵。
#   ⚠ 「下から続く黒でない行をメッセージ枠と見なす」やり方は外した。
#     枠が出ていない画面では**敵そのものを枠と誤認**して帯が空になった。
# --- 研究用の採取（2026-08-13 / 製品版ログ整理 §22）-------------------
#
# ★★ **通常運用では走らせません。** ★★
#   指示書 §20・§21 は NORMAL でも DIAGNOSTIC でも research capture を
#   OFF と定めています（§22 は専用ツールへ寄せる）。
#
# ⚠ 「絵を撮るのをやめる」話ではありません。★絵は
#   `python -m dq2rom monsters extract`（ROM から）で 82 体そろっており、
#   実機の撮影10枚と画素まで一致しています。
#   ★画面からの採取は**その確かめのため**の研究作業です。
#
# ⚠ ログの段階（logging.mode）とは**別**にしてあります。
#   ★研究は「ログを多く出す」ことではなく「別の仕事をする」ことなので、
#     第3のログレベルにすると混ざります。
#
# ★user_config.yaml の `research.capture` で上書きできます。
research:
  capture: false

monster_art:
  enabled: true
  # 図鑑が読む場所（切り出し済み）。ファイル名は <敵ID2桁16進>.png
  dir: work/monster-art
  # ★ROM から展開した絵（2026-07-29）。**こちらを先に見る。**
  #   82体そろっていて、実機の撮影10枚と画素まで一致している。
  #   置くのは `python -m dq2rom monsters install`（明示的に実行するもの。
  #   解析ツールの副作用で本体のデータを書き換えない）。
  #   ⚠ `dir` と**同じ場所にしない**。混ぜるとどちらが出ているか分からなくなり、
  #     `dq2rom monsters validate` の材料も壊れる。
  rom_dir: work/monster-art-rom
  # ★撮ったままの画面（256x224）を置く場所。**消さない。**
  #   切り出しの規則を直したときに**撮り直さずにやり直せる**。
  #   実機での撮影は何度もやり直せないので、元は必ず残す。
  raw_dir: work/monster-art/raw
  # 敵が現れる演出が終わるまで待つフレーム数。
  # ★すぐ撮ると出現途中の絵になる。1.5秒ぶん取ってある。
  #   ⚠ 倍速中でもフレーム数で数えるので、実時間は短くなる（それでよい）。
  settle_frames: 90
  # 1体だけの戦闘に限るか。
  #
  # ★★ false にした（2026-07-27 / 実測の結果）★★
  #   true にして実機を14000フレーム走らせたら、**5戦闘すべてで撮れなかった**
  #   （既に持っている種か、複数体だったため / work/art_capture_run.txt）。
  #   1体の戦闘を待つのは効率が悪すぎる。
  #
  # ★代わりに**切り出し側で1体だけ取る**ようにした。
  #   体と体の間には黒い列があるので、そこで分けて左端の1体を採用する
  #   （retroux/core/art/trim.py の column_blobs）。
  #   これなら3体並んでいても図鑑に載る絵は1体になる。
  #
  # ⚠ 種が複数のときは相変わらず撮らない（どの絵がどの敵か決められない）。
  #   それは `single_individual_only` とは別の判定。
  single_individual_only: false

# --- MPの予約（Phase 6 P5 / 依頼者の項目4・5）---------------------------
#
# > リレミトのMPを残す（まんたんのときも有効）
# > ルーラのMPを残す（まんたんのときも有効）
#
# ★ここに書いた呪文のぶんだけ MP を残す。**戦闘AIとまんたんの両方**に効く。
#   ダンジョンの奥でMPを使い切って出られなくなるのを防ぐための予約。
#
# ★★ 予約は「その人が覚えている呪文」だけ数える ★★
#   習得済みビット（$061A / $061B）から見るので、
#   覚える前は予約されず、覚えた瞬間から予約される。設定を直す必要がない。
#
#   ROM の SpellLevels で確定した習得（bank4.asm:9700）:
#     ルーラ  (0x14 Return)  … **サマルトリアだけ** LV10
#     リレミト(0x12 Outside) … **サマルトリア LV12 と ムーンブルク LV17 の両方**
#
#   -> サマルトリアは 6+6=12 / ムーンブルクは 6 を残す（両方覚えたあと）。
#      ローレシアは呪文を持たないので 0。
#
# ⚠ **リレミトを2人ぶん予約するのは意図した動作**（過剰ではない）。
#   サマルトリアが死ぬとその人の呪文は唱えられない。
#   ムーンブルクのリレミトが最後の出口になるので、そちらも残す必要がある。
#   「1人が覚えていれば足りる」は**死亡を考えていない**。
#
# ⚠ 予約でMPが足りなくなると、まんたんは**やくそうへ落ちる**（在庫を使う）。
#   ゴールドを使ってでも「出られなくなる」ほうを避ける、という判断。
#   落ちたときは理由をログに出すので、黙って在庫が減ることはない。
#
# mp_field は memory_map の spells から引く（設定に数値を書かない）。
# 無効にしたい場合は enabled: false か spells を空にする。
mp_reserve:
  enabled: true
  spells:
    - { id: 0x14, name: ルーラ }      # 町へ戻る。サマルトリアのみ
    - { id: 0x12, name: リレミト }    # ダンジョンを出る。2人が覚える

# ボスのモンスターID。RAM解析が未了のため空。
# ⚠ 空の間は起動時とGUIに警告を出す（DEV-8）。
# 「遭遇済み」は戦闘開始時に登録するため、ボスに敗北して再戦すると
# 遭遇済み扱いになり、倍速＋自動たたかうで確実に負ける。
# 逆アセンブルのモンスター名テーブルから特定（2026-07-25 / DEV-8 の穴を塞いだ）。
# 根拠: work/dq2-disasm の MonsterNames テーブル。敵ID = テーブルindex + 1。
# 実測との照合（$01=Slime=スライム / $02=Big Slug=おおナメクジ）でID対応を確認済み。
boss_monster_ids:
  - 0x4E   # アトラス
  - 0x4F   # バズズ
  - 0x50   # ベリアル
  - 0x51   # ハーゴン
  - 0x52   # シドー

# --- まんたん（HPを満タンまで回復）-------------------------------------
#
# 回復手段を**優先順に**並べる。上から順に使えるものを使う。
# ホイミを先に置けば MP を使い、MP が尽きたらやくそうへ落ちる。
#
# kind: spell  呪文。MPを消費する（ゴールドがかからないので基本はこちら）
#   row      呪文リスト($0x14)の行番号。
#            ★呪文には持ち物のような「所持リスト」が RAM に無いため、
#              ID で探せない。行番号で指定する。
#              ホイミはサマルトリアが最初に覚える呪文なので行0（実測）。
#              覚える呪文が増えても学習順に並ぶため行0のままになる想定。
#              ★ずれていた場合も「HPが増えなければ中止」で安全側に止まる。
#   mp_cost  消費MP。実測でホイミは3。これ未満のMPなら使わない
#   caster   auto = MPを持っている人から自動で選ぶ
#
# kind: item   道具。ゲーム内の在庫を消費する
#   id       アイテムID（memory_map.yaml の items）
mantan:
  # --- 回復の目標（GUI から切り替えられるようにモード名で持つ）-----------
  #
  # ★既定は ratio90（9割）。依頼者の判断:
  #   「文字通り満タン」だと最後の数ポイントのために1回余分に使うことになり、
  #   やくそうもMPも無駄になる。9割まで戻れば実用上は十分。
  #
  # 目標割合の使い方: 現在HP < floor(最大HP × 割合) の人を回復対象にする。
  #   例）最大58 で 0.9 -> しきい値52。52以上なら回復しない。
  #
  # GUI から切り替えるときはモード名だけを渡す（command.json の mantan_mode）。
  # 割合そのものを渡さないのは、画面に出す名前と実際の挙動をずれさせないため。
  mode: ratio90
  modes:
    full:    { target_ratio: 1.0, label: 満タン }
    ratio90: { target_ratio: 0.9, label: 9割 }

  # ★呪文は **id（呪文ID）で指定する**。row は突き合わせ用に残してあるだけ。
  #   id があれば習得済みビット($061A)から行番号を計算できる（下の
  #   spell_row_source を参照）。row だけの指定は覚えると壊れる。
  #   id は memory_map.yaml の spells を参照（0x09 ホイミ / 0x10 キアリー）。
  # --- expected_heal の根拠（2026-08-02 / 指示書 §8.2）------------------
  #
  # ★★ **ROM の逆アセンブルから取った確定値です。推測ではありません。** ★★
  #
  #   `work/dq2-disasm/src/us/prg/bank6.asm` B06_8BD3 付近
  #     ホイミ    (Spell $09) -> ldx #$40 ; power on field for Heal     = 64
  #     Healmore  (Spell $0B) -> ldx #$64 ; power on field for Healmore = 100
  #     Healall   (Spell $0D) -> ldx #$FF ; 全回復
  #
  #   `bank4.asm` B04_A412 -> B04_AE8C
  #     「$B0 = random number tightly distributed around A / 2」
  #     中身: 回復量 = power × R >> 8（R は $80 = 128 を中心に散らばる乱数）
  #     → **期待値 = power / 2**
  #
  #   したがって  ホイミ 64/2 = 32  /  Healmore 100/2 = 50
  #
  # ⚠ **乱数です。** 1回ごとに上下します。だから指示書 §8.7 のとおり
  #   「1回回復するたびに実際のHPを読み直して」次の1回を選び直します。
  # ⚠ 期待値であって最大値ではありません。足りなければもう1回唱えます。
  methods:
    - { kind: spell, name: ホイミ, id: 0x09, row: 0, mp_cost: 3, caster: auto,
        expected_heal: 32 }
    # ★Healmore(0x0B)。**ムーンブルクは ホイミ を覚えない**（彼女の回復呪文はこれ）。
    #
    #   ⚠ これを書かないと、ムーンブルクのMPが余っていても使われず
    #     やくそう（ゴールドで買う在庫）が減る。実際そうなった:
    #       実機ログ 12:47:56「ホイミ の行番号を計算できない（未習得 / moonbrooke）」
    #       -> やくそう 5個 -> 2個
    #
    #   ★実測の裏付けはある（07:58 のログ / 当時は行0指定で偶然これを唱えていた）:
    #     lorasia のHP +9 / MP -5。ROM の Healmore の消費5と一致する。
    #   ⚠ ただし**日本語名は画面で確認していない**ので英語名のままにする
    #     （name を書かなければ memory_map の名前が使われる。推測で書かない方針）。
    #   ★expected_heal 50 の根拠は上の表（power 100 / 2）。
    #     以前ここに書いた実測「lorasia のHP +9」は**最大HPで頭打ち**に
    #     なった値なので、期待回復量の根拠には使えない。
    - { kind: spell, id: 0x0B, mp_cost: 5, caster: auto, expected_heal: 50 }
    # --- やくそうの expected_heal ------------------------------------
    #
    # ⚠⚠ **これは ROM から取った値ではありません。依頼者の指定です。**
    #   （2026-08-02「やくそうの回復量はホイミと同等で考えて」）
    #
    # ★上のホイミ・Healmore は逆アセンブルから導いた確定値ですが、
    #   ここだけは**根拠の種類が違います**。道具の効果表はまだ読んでいません。
    # ★確かめたくなったら: ROM の道具効果表を読むか、実機でHPの増え方を測る。
    #   分かったらこの注記ごと差し替えてください。
    #
    # ⚠ 影響: やくそうがコスパ比較に**混ざるようになります**
    #   （消費MP 0 なので、MPを使う呪文より「安い」と判定されます）。
    #   ★それでも `herb_policy: after_spells`（既定）なら呪文が先です。
    #     順番の規則が先に効き、コスパ比較はその中での並べ替えだからです。
    - { kind: item,  name: やくそう, id: 0x3C, expected_heal: 32 }

  # --- 誰のMPから使うか（2026-08-01 / 依頼者の実機確認）------------------
  #
  #   most_mp    … **MPの残りが多い人の呪文から**使う（既定）
  #   list_order … 上の methods に書いてある順（従来）
  #
  # ⚠⚠ 既定を most_mp にした理由（実機ログ 2026-08-01 13:33）:
  #
  #   | 使ったもの | サマルトリアMP | ムーンブルクMP |
  #   | --- | ---: | ---: |
  #   | ホイミ×4（samaltria） | 35 -> 23 | **83（手つかず）** |
  #
  #   書いてある順だと、先頭のホイミ（サマルトリア）が使える限り
  #   Healmore（ムーンブルク）まで届きません。依頼者の指摘:
  #   「まんたんでムーンブルグを使わなさ過ぎる」。
  #
  # ★MPの多い人から使うと、**戦闘中に要るサマルトリアのMPが残ります**
  #   （戦闘の回復呪文はホイミだけなので、彼女しか唱えられない）。
  # ⚠ 道具（やくそう）は最後のままです。買い足しにゴールドが要るので、
  #   MPで済むならそちらを先に使います。
  cure_order: most_mp

  # --- 呪文の行番号をどこから取るか（2026-07-26）--------------------------
  #
  #   verify   … 設定の row と計算した行の**両方が一致したときだけ**唱える（既定）
  #   computed … 計算だけを使う（row を見ない）
  #   config   … 従来どおり row だけ（計算が壊れたときの逃げ道）
  #
  # ★いきなり computed にしない（依頼者の指示）。verify で実機でも
  #   食い違わないことを確かめてから移行する。
  #   ★机上の確認は済んでいる: research/probes/active/check_spellrows.py が全10セーブステートで
  #     「計算=1 / 設定=1」の一致を報告した（食い違い0件）。
  #     さらにサマルトリア LV9 の戦闘呪文リストの計算結果
  #     （列0行0 ギラ / 列0行1 マホトーン / 列1行0 ホイミ）が
  #     実測 O-4（敵狙い / 敵狙い / 味方狙い）と一致した。
  spell_row_source: verify

  # --- 毒を治す（依頼者の要望）-----------------------------------------
  #
  # > 毒のときはキアリー、毒消し草を使ってほしい（まんたんで）
  #
  # ★毒はHP回復より**先**に治す。毒は歩くたびにHPを削るので、
  #   先に止めたほうがやくそう・MPの無駄が少ない。
  # ★HPが満タンでも毒があれば実行する。
  # ★検証は「**毒が消えたか**」で行う（HP回復とは見る効果が違う）。
  #   毒消しはHPを増やさないので、HPで判定すると必ず失敗と判断してしまう。
  cure_poison: true
  # 1回の実行で毒を治す回数の上限（暴走の歯止め）
  max_cures: 6
  cure_methods:
    #
    # ⚠⚠ キアリーは長いあいだ「有効にできない」手段だった。経緯を残す。
    #     （2026-07-26 に習得済みビットが見つかり、行番号を計算できるようになった）
    #
    #   呪文には持ち物のような所持リストが RAM に無い（と思われていた / DEV-17）ため、
    #   **行番号でしか指定できなかった**。行番号を間違えたときの被害が道具とは違う:
    #     隣が **ルーラ** だと**町へ飛ばされる**。プレイ中には取り返しがつかない。
    #   「にげる」を誤って押す事故（memory_map の 0x09 の警告）と同じ種類。
    #
    #   さらに **行番号は人によって違う**。_pick_caster はMPが多い人を選ぶので、
    #   サマルトリアの行1が キアリー でも、ムーンブルクの行1は別の呪文。
    #   有効にするなら caster を固定するか、両者の行を確認すること。
    #
    #   ★行番号は判明した（2026-07-26 / work/mantan/kiari.txt / スロット1）:
    #     **サマルトリアの キアリー = 呪文リストの行1**
    #       行0 -> HP +16 / 毒は残る            = ホイミ
    #       行1 -> 毒が消えた / MP -3           = キアリー ★
    #     1行ずつ唱えてスロットを読み直す方法で確かめた（外しても元に戻る）。
    #
    #   ⚠⚠ **それでも有効にできない。** 唱える人を固定する仕組みが無いため。
    #     _pick_caster は**MPが最も多い人**を選ぶ。実測ではサマルトリア48に対し
    #     ムーンブルク58なので、**ムーンブルクが選ばれる**。
    #     彼女の行1が何かは未確認で、**ルーラだったら町へ飛ばされる**。
    #     行番号は人によって違うので、1人ぶん分かっても安全にはならない。
    #
    #   ★対策A を実装した（2026-07-26）: **唱える人を固定できる**ようにした。
    #     依頼者の確認:「キアリーはたしかサマルトリアしか唱えられない」
    #     caster を書くとその人しか選ばれない。MPの多い人に流れて
    #     別の呪文（ルーラ等）を唱える事故を防げる。
    #
    #   ⚠ 固定しても「その人のその行が本当にキアリーか」は保証されない…
    #     というのが対策A までの状態だった。**ここが解決した（下記）。**
    #     ★呪文を覚えたら行番号を確認し直す、という運用は**もう要らない**。
    #       習得済みビットから毎回計算するので、覚えた瞬間に追従する。
    # ★依頼者の指定順「キアリー、毒消し草」。呪文を先に使う。
    #   MPは宿屋で戻るが、どくけしそうはゴールドを使う。
    #
    # ★★ 行番号は**計算**に変えた（2026-07-26）。row は突き合わせ用の記録 ★★
    #
    #   id: 0x10 を書いておけば、習得済みビット($061A)から行番号を計算できる。
    #   覚えて並びがずれても、人が違っても、計算はついてくる。
    #   ・サマルトリア LV6+  -> 行1（設定の row と一致。全10セーブで確認）
    #   ・ムーンブルク LV12+ -> **行2**（人によって違うことがこれで分かる）
    #   計算できないときは唱えず、どくけしそうへ落ちる（下の行）。
    #
    #   mp_cost は ROM の実値 3 にした（bank6.asm の MP Cost for Spells on Field）。
    #   実測でも MP が 3 減っている。以前の 2 は控えめな見積もりだった。
    - { kind: spell, name: キアリー, id: 0x10, row: 1, mp_cost: 3, caster: samaltria }
    # どくけしそう は**アイテムIDで確実に特定できる**ので常に有効。
    # キアリーが使えないとき（サマルトリアが死亡・MP切れ）の受け皿。
    - { kind: item, name: どくけしそう, id: 0x3B }

# --- 行動単位ログ（MVP2 Phase 3 / 指示書 7.4・7.5）--------------------
#
# 戦闘中の「出来事」を1件ずつ記録します。あとから
#   ・どのターンで誰のHPがどう動いたか
#   ・AI が何を選び、なぜそうしたか
# を追えるようにするためのものです。
#
# ★記録するのは**観測できる事実だけ**です。
#   「誰の攻撃で誰が減ったか」の対応づけはしません。DQ2 は行動順を
#   RAM に出しておらず、同じフレームに複数の変化が起きるためです。
#   推測を混ぜると、後から見たときに事実と区別できなくなります。
battle_log:
  enabled: true
  # 1戦闘に記録する上限（暴走の歯止め）。
  # ★普通の戦闘は数十件です。これを超えるのは何かがおかしいとき。
  max_rows_per_battle: 200

# --- 警戒リスト（逃げた/負けた相手）----------------------------------
caution:
  # ★誰かがレベルアップしたら警戒リストを空にする（依頼者の判断 / 2026-07-25）。
  #
  # 逃げた理由は「そのとき弱かった」ことなので、強くなったなら再挑戦させる。
  #
  # これが無いと一度入った相手は**勝つまで抜けられない**。
  # 実害: Drakee(4) が居座り、序盤の常連なので出会うたびに等速＋手動になり
  # 「自動戦闘がきかない」と受け取られた。しかも警戒中は自動入力が切れるため
  # 常に手動＝「プレイヤーが操作していた」と判定され、その戦闘で敵が逃げても
  # 抜けられない。行き止まりになっていた。
  #
  # レベルは $063E（間隔 0x12）。画面の「あかり LV8」と一致を確認済み。
  clear_on_level_up: true

# --- 補充（店で足りない分だけ買う）-------------------------------------
#
# 「持っておきたい道具群」を定義し、**足りない分だけ**買う。
# 店の前でホットキーを押すと動く（下の hotkeys を参照）。
#
# want は**パーティ全体の合計**で数える。誰が持っているかは問わない。
#   例: やくそうを3個持ちたい。ローレシアが2個・サマルトリアが1個なら足りている。
#
# 買うのは「その店が扱っていて、かつ足りていない物」だけ。
# 扱っていない物は黙って飛ばす（店ごとに品揃えが違うため）。
# 所持金が足りなければ買える分だけ買って、残りは報告する。
#
# ★id はアイテムID。memory_map.yaml の items を参照。
#   装備中フラグ(0x40)は付けない。素のIDを書く。
#   name は人が読むためのメモで、判定には使わない（ID が正）。
restock:
  enabled: true
  items:
    - { id: 0x3C, want: 3, name: やくそう }
    - { id: 0x3B, want: 1, name: どくけしそう }
    - { id: 0x35, want: 1, name: キメラのつばさ }   # EN: Wing of the Wyvern

  # 買い物のあと所持金をこれ以上残す（0 なら使い切ってよい）。
  # 宿屋代や船賃で詰まないようにするための余裕。
  keep_gold: 0

  # 1回の実行で買う個数の上限（暴走の歯止め）
  max_purchases: 20

# --- ふくびき（券がある間だけ連続で回す）-------------------------------
#
# 依頼者の要望:
#   「ふくびき券がある間はふくびきを連続でやりたい
#     やりますか？Yes / せつめいをききますか？No / Aボタン連打」
#
# ★削るのは反復操作だけ。券は増やさず、抽選結果にも触れない。
#
# 実測で確定した経路（work/fukubiki/probe.txt / answers.txt）:
#   00 フィールド -A-> 06 コマンド -はなす(0,0)で A-> 04 会話
#     -> 19 行数2「やりますか？」  -> 行0（はい）
#     -> 19 行数2「せつめいをききますか？」-> 行1（いいえ）
#     -> メッセージ（B で送る）-> 券が1枚減る
#
# ★はい/いいえ の行は画面の文字を読まずに確定した。
#   4通りの答え方を試し、**券が減る組み合わせ**を見つけた（効果で検証）。
#
# ⚠ メッセージ送りは **B**。A で送ると会話終了後の A がコマンドメニューを開き、
#   さらに「はなす」が走って会話がやり直しになる（実測で繰り返した / playbook #16）。
fukubiki:
  enabled: true
  # ふくびき券のアイテムID（memory_map の items で確認）
  ticket_id: 0x33
  # 回す回数の上限。券が尽きれば自然に止まるが、二重の安全弁として持つ
  max_rounds: 30
  # 1周あたりのフレーム上限（抽選の演出を含む）。超えたら中止する
  round_budget: 3000
  # ★質問が出た直後は行数($0081)が 0 を返す過渡状態がある。
  #   その間は何も押さないで待つフレーム数。
  #   ここで押すと意図しない行が確定する（実測で はい が取り消された）。
  settle_frames: 20
  # 全体のフレーム上限
  frame_budget: 40000
  press_hold: 8
  press_gap: 18
  # ★待ちと寄せでカウンタを分ける（playbook #28）
  wait_tries: 40
  seek_tries: 12

# --- ホットキー（キーボード）-------------------------------------------
#
# ゲームパッドではなくキーボードで受ける。ゲーム操作と衝突しないため。
# FCEUX の input.get() でキー名が true になる形で読める（実測で確認）。
# ★押した瞬間（立ち上がり）だけを見る。押しっぱなしで連続実行しない。
#
# 空にすると無効。FCEUX 側のホットキーと重ならないキーを選ぶこと。
hotkeys:
  mantan: "M"        # HPを回復（既定は9割まで）/ 毒も治す
  # ★R = 「話しかけて相手に応じたことをする」（依頼者の要望）。
  #
  #   > ふくびきのキーバインドはRestockと同じくR
  #   > （はなす→ 返答が違うので区分けできる）
  #
  #   はなした直後に出るメニューIDで相手を見分ける（実測で確定した値）:
  #     0x18 店の売買選択（かいにきた/うりにきた）-> 補充
  #     0x19 ふくびき の会話                       -> ふくびき
  #   どちらでもなければ**何もせず中止**する（知らない相手には押さない）。
  #
  # ⚠ restock / fukubiki を個別に割り当てることもできるが、
  #   **同じキーに2つ割り当ててはいけない**。ホットキーは
  #   「1キー = 1つの操作要求」なので、片方が必ず「実行中」で無視される。
  #   R には talk（振り分け役）だけを割り当てる。
  talk: "R"          # 話しかけて 補充 / ふくびき を自動で選ぶ
  # 個別に使いたい場合の予備キー（既定は空＝無効）。
  # 空きキー: B C E G H J K N T U V X Y
  restock: ""        # 店の補充だけを直接
  fukubiki: ""       # ふくびきだけを直接
  # --- 強制AUTO（消化試合用）------------------------------------------
  # ★安全機構（危険状態 / 初遭遇 / 警戒中 / 手動ラッチ）を意図的に潰す。
  #   勝てると分かっている戦闘を早く終わらせるための手動スイッチ。
  #   入れたら解除するまで続く（戦闘をまたいで有効）。
  #   画面左上に FORCE AUTO と出る。
  # ★キーの衝突確認は2か所を見る（research/probes/active/check_hotkeys.py で調べられる）:
  #   1. ゲームパッドの割り当て（GamePadConfig_V2）
  #      D=B / F=A / S=Select / Enter=Start / 矢印キー
  #   2. FCEUX 本体のホットキー（FCEUD_CommandMapping_V2）★最初これを見落とした
  #      予約済み: Q R M W Z I L O P Tab Space Enter F1-F12 数字 記号
  #
  # Q は FCEUX の「ムービーの読み取り専用切替」に予約されていた
  # （押すと MOVIE IS READ+WRITE と表示される。依頼者の報告で判明）。
  # 空いているアルファベット: A B C E G H J K N T U V X Y
  #
  # ⚠ M（まんたん）と R（補充）も FCEUX 側と重複している。
  #   動作はするが FCEUX の動作も同時に走る。気になる場合は上の空きキーへ。
  # ★A は**トグル**（押すたびに入り切り）。依頼者の要望:
  #   「Auto終了はもう１回Aでもいいや。トグルにしよう。」
  #   解除キーを覚える必要がなく、FCEUX の予約キーとの衝突も避けられる。
  #   押すたびに画面に FORCE AUTO: ON / OFF を3秒出す
  #   （同じキーだと「入れたつもりで切っていた」事故が起きるため必ず出す）。
  force_auto: "A"    # 強制AUTO の入り切り（トグル / 空きキー）
  # 切る専用のキー。トグルにしたので通常は不要。空なら無効。
  # 「確実に切りたい」場合のために残してある（押しても入ることはない）。
  release_auto: ""

logging:
  db_path: work/retroux.sqlite3
  events_path: work/events.jsonl
  command_path: work/command.json
  # ★★ 出す量の段階（2026-08-13 / 製品版ログ整理 §19）★★
  #
  #   normal      … 通常利用。work/retroux.log は INFO 以上（§20）
  #   diagnostic  … 不具合調査。DEBUG 以上（§21）
  #
  # ⚠ Lua 側もこれを見ます（bridge.lua の Bridge.resolve_log_min）。
  #   これを入れるまで、Lua の行は**段階を持たず全部出ていました**
  #   （実測: work/retroux.log の 63% / 33,578 行）。
  #
  # ★user_config.yaml の `logging.mode` で上書きできます。
  mode: normal

# --- 歩いた地図（2026-07-29 / 依頼者の決定 Q1・Q3）---------------------
#
# ★★ **完全地図は出さない。** ★★
#   出すのは「自分が通ったマス」だけ。ダンジョンの探索を潰さないため
#   （RetroUX の原則: 待ち時間と反復作業だけを改善する）。
#
# ★★ 2026-08-03: **地形も読めるようになりました。**
#   日本版ROMのマップ形式を解読し、非ワールドマップ 108/108 と
#   世界地図 65536/65536 を ROM だけで展開できます。
#   詳しくは `docs/map-decoder-architecture.md`。
#
# ⚠ ただし**この節（rendering）は観測から描く現行方式**の設定です。
#   ROM の地図を使う設定は下の `rom_master:` にあります（★既定は off）。
map:
  # --- 描き方（2026-08-02 / マップ指示書 §16）---------------------------
  #
  # ★★ **現行表示を消しません**（指示書 §15.5）★★
  #   新方式が安定するまで、切り替えて見比べられるようにしてあります。
  #
  #   character_metatile … 背景CHRから作ったメタタイル画像を並べる（新）
  #   legacy_pixel       … 単色セル／タイルの絵（現行）
  #
  # ⚠ 新方式にしていても、**引ける画像が半分に満たなければ現行へ落ちます**。
  #   まだらに欠けた地図は、単色より読みにくいためです。
  # ⚠ ワールドマップは第一弾では現行のままです（指示書 §2.1）。
  #
  # ⚠⚠ **`local` という名前を使わないこと**（2026-08-02 に踏んだ）。
  #   指示書 §16 の例は `local:` だが、そのまま書くと生成される Lua が
  #   `local = "..."` になり、**`local` は Lua の予約語**なので
  #   `unexpected symbol near 'local'` で読めなくなる（テスト14件が赤）。
  #   ★`non_world`（ワールドマップ以外）にする。意味は同じ。
  # --- ROM から作った地図（2026-08-03 / Phase 5）------------------------
  #
  # ★★ **既定は現行のままです。** ★★
  #   `renderer: rom_master` にすると、ROM だけで作った地図を使います。
  #   ⚠ MapMaster を作れないマップ（世界地図、ポインタ食い違い）では
  #     **必ず現行表示へ落ちます**（`fallback_renderer`）。
  #
  #   reveal_mode:
  #     explored … ★歩いたマスだけ（**既定**。指示書 §2.2）
  #     all      … ⚠ 全部見せる。**検証用**。探索を潰すので普段は使わない
  # ⚠⚠ 2026-08-12 まで、**ここは書いても効きませんでした**（監査 P0-A）。
  #   読む口（`core/bgmap/settings.py`）はあったのに、呼んでいたのは
  #   テストだけで、`presenter.py` は設定を通らずに ROM で描いていました。
  #   ★いまは `gui.py:_build_map_render` が読んで ViewModel へ渡します。
  #   ⚠ 既定は `rom_master`（＝いまの実際の挙動）に直しました。
  rom_master:
    renderer: rom_master          # observed | rom_master  ★効きます
    fallback_renderer: observed   # ★効きます（ROM で組めないときの戻り先）
    reveal_mode: explored       # explored | all           ★効きます
    # ⚠⚠ 下の3つは **まだ切り替えられません**（描き手に口がありません）。
    #   ★書いてある値＝いまの挙動です。既定から変えると
    #     起動ログに「効きません」と出ます（黙って無視しません）。
    show_dynamic_objects: true    # ⚠ 固定（宝箱・扉は常に出ます）
    # ⚠ 表にだけある座標（unknown_dynamic）は既定で出しません
    show_unknown_objects: false   # ⚠ 固定
    # ★部屋の色分け（debug 表示）
    show_regions: false           # ⚠ 固定（第一弾に入れない判断 / BACKLOG 2.2）

  rendering:
    world: legacy_pixel
    non_world: character_metatile
    # 背景の素材の置き場所（★Git 管理外）
    #
    # ⚠⚠ 2026-08-12 まで、**ここに書いても効きませんでした**。
    #   `gui.py` が読んでいたのは `map.assets_dir` で、名前が違ったためです
    #   （落ちない代わりに黙って既定へ落ちる / バックログ P0-01）。
    #   ★いまは `core/bgmap/catalog.py:resolve_assets_dir` の1か所で引きます。
    #
    # ⚠ **採取の側は `work/map-assets` に固定**です
    #   （`research/probes/active/bg_capture_probe.lua` が直に書きます）。
    #   ★ここを変える場合は、作った素材を移すか、
    #     `python -m retroux.tools.dq2_map --assets <path>` で渡してください。
    #   ⚠ 既定から変えると、起動ログにその旨が出ます（黙って変えません）。
    assets_path: work/map-assets
    capture:
      # ★採ってよい状態（指示書 §6.2）。⚠ ここを緩めると
      #   移動中やメニュー中の背景が地形として残ります。
      allowed_state: field_idle
      # ★背景ハッシュが何回続けて同じなら「落ち着いた」とみなすか（§6.3）
      stable_samples: 3
      # ⚠⚠ 黒観測は地形にしない（§11.2）。既存の地形も上書きしません
      ignore_black: true
      reject_menu_chr: true
      reject_movement_frames: true
      reject_transition_frames: true

  # --- 採取のしかた（2026-08-07 / 軽量化指示書 §4）-----------------------
  #
  # ★★ **立ち止まっている間は採り直しません。** ★★
  #   以前は 0.5 秒ごとに必ず3種類を採っていました。`legacy_colors` は
  #   1マス 64 画素 × 225 マスで**1万回超の画素読み**になり、
  #   ⚠ 画面を触っているだけの時間まで重くしていました。
  #
  # ⚠ 出す中身は変わりません。★変わるのは「採り直す回数」だけです。
  observe:
    # ★ map_id / x / y のどれかが変わったときだけ採る（§4.1・§4.2）
    on_move_only: true
    # ⚠ 16×16 の絵は**スクロールが 16 の倍数のときしか出ません**。
    #   ★移動直後に1回だけ採ると nil で固定されるので、出るまで粘ります。
    #   ⚠ `ppu` が無い環境では出ないので、上限で打ち切って1回だけ記録します。
    retry_limit: 8

    # --- 旧方式（§4.3）----------------------------------------------------
    #
    # ⚠⚠ **指示書は `legacy_colors` を既定 OFF としていますが、ON のままです。**
    #
    #   ★理由（実測 / `work/retroux.sqlite3` 55,334 マス）:
    #
    #       色あり            44,762
    #       16×16 の絵あり    13,373   ← ★24% しかない
    #       色だけ            31,774
    #       世界地図（map 1） 42,626 中 絵ありは 6,055（★14%）
    #
    #   ★絵が引けないマスは**色で塗っています**（`tile_color(...) or
    #     _trail_color(visits)`）。⚠ 色を採らないと、新しく歩いたマスが
    #     「訪問回数の灰色」になり、**世界地図で陸と海が区別できなくなります**。
    #     → 指示書 §4.5 の「通常プレイでマップ記録が欠落しない」に反します。
    #
    #   ★重さのほうは `on_move_only` で解決しています（立ち止まり中は 0 回、
    #     歩行中は 1マス 1 回 ＝ 従来の 15 フレーム間隔とほぼ同じ）。
    #   ⚠ 絵の網羅率が上がったら false にしてください（調査時も false）。
    legacy_colors: true
    legacy_tiles: true
    cells: true

  # `python -m dq2rom maps export` が出した maps.json
  # ★無くても動きます（そのときは見た範囲に合わせた枠で描きます）
  meta_path: work/map-data/maps.json

  # 地図に記録する「画面に映る範囲」の半径（マス）。
  #
  # ★依頼者の指定（2026-07-29）:
  #   > マップは、歩いた所じゃなくて、画面に映った所は表示するほうがいいね
  #   > 定義は、そんなに難しく考えなくて良くて、真ん中からｘキャラ分とかで良いよ
  #
  # 主人公を中心に ±この数のマスを「見た」として記録します。
  # 既定 7 の根拠: 画面 256×240 ÷ 1マス16px = 16×15 マス、その半分。
  # ⚠ 実機で測った値ではありません。地図がずれて見えるなら変えてください。
  # ⚠ 暗いダンジョンでは実際に見えていない所まで入ります。
  #   気になるなら小さく（例 2〜3）してください。0 にすると立ったマスだけ。
  view_radius: 7

  # --- ステータス窓のタイルID（2026-08-02 / 課題 #65）-------------------
  #
  # ★★ **実測値です。憶測ではありません。** ★★
  #
  # 依頼者:
  #   > 多分ある気がするので、撮ってみて
  #   > （動けば窓消えるし、止まれば窓が出るはず）
  #
  # ★この一言が決め手でした。同じ場所で「窓あり」と「窓なし」を作り分け、
  #   引き算すれば窓のタイルだけが残ります（`window_tiles_probe.lua`）。
  #
  # 採用したのは、次の**3つとも**満たすIDだけです:
  #   1. 止まっているときに出た
  #   2. 動かしている最中には出なかった（★押しっぱなしのまま撮る）
  #   3. 8px 行 20 より上には一度も出なかった（＝地形ではない）
  #
  # ⚠ 3 が要ります。歩けば地形も変わるので、差分だけでは分けられません。
  #   実際 $A0-$AF（岩壁 / 行0-15）や $90-$9F（行14-17）が候補に混ざり、
  #   行で切って初めて外れました。
  # ⚠⚠ $5F（空白）が入っていないことを確認済み。**入れてはいけません。**
  #   空白は地の色なので、窓と見なすと地図が全部消えます。
  #
  # 確かめた場所: ダンジョン3種（$3F $40 $63）/ 街（$0B）/ 世界地図（$01）
  #
  # ⚠ ここに無いIDを使う窓が別の場所にあるかもしれません。そのときは
  #   そのマスが「分からない」になるだけで、嘘は記録されません。
  status_window_tiles:
    [0x00, 0x01, 0x02, 0x04, 0x05, 0x07, 0x08, 0x09, 0x0A, 0x0D, 0x0F,
     0x1E, 0x28, 0x31, 0x3C, 0x48, 0x4B, 0x50, 0x55, 0x59,
     0x62, 0x63, 0x64, 0x65, 0x66,
     0x76, 0x77, 0x78, 0x79, 0x7A, 0x7B, 0x7C, 0x7D, 0x7E]

  # --- ワールドマップの大きさ（2026-07-30）-----------------------------
  #
  # ★★ **実測値です。** ROM のヘッダ表では map 01（ワールドマップ）の
  #   幅・高さが `$FF,$FF` になっていて読めません。そこで
  #   **実際に記録された座標**から決めました:
  #     x は 128..255 に 4,950 マス、y も同様に分布
  #     座標は1バイト（`$16`/`$17`）なので上限は 256
  #   → **256 × 256**。
  #
  # ⚠ 指示書（`input/MAP表示改善.md`）は 128 を例示していましたが、
  #   **128 では収まりません**（指示書自身が「実測で別値なら正しい値を」と
  #   書いているため実測に従いました）。
  overworld_width: 256
  overworld_height: 256

  # --- 拡大倍率（2026-07-30 / 指示書 `input/MAP表示改善.md` 2章）---------
  #
  # ★★ **整数倍だけ。** 1.3倍のような半端な拡大はしません。
  #   半端だと1マスが 2px と 3px に割れて、同じ地形が違う大きさに見えます。
  #
  # ★**0 にすると「枠に収まる最大の整数倍」**になります（大きく見たいとき）。
  #   ⚠ どちらにしても補間はしません（ぼかしません）。
  #
  # ★★ 2026-08-01: 依頼者の実機確認で **倍にしました** ★★
  #   「MAPの縮尺が小さすぎる。倍の大きさでいいかも」
  #
  #   | | 前 | 後 | 実際の大きさ |
  #   | --- | ---: | ---: | --- |
  #   | 通常マップ | 4 | **8** | 最大 29×25 マス -> 232×200 px |
  #   | ワールドマップ | 1 | **2** | 256×256 マス -> **512×512 px** |
  #
  #   ⚠ ワールドマップ 512px は、地図ウィンドウの既定（880×640）に
  #     入りますが、**窓を小さくすると収まりません**。
  #   ★収まらないときは `pick_zoom()` が自動で1倍まで下げます
  #     （`min(want, fit)`）。見切れることはありません。
  zoom: 8
  overworld_zoom: 2

  # --- 遷移タイルの写真（2026-07-30 / マッパー仕様 フェーズ4）-----------
  #
  # ★★ **人が押したときだけ撮ります**（地図ウィンドウで Ctrl+P）。 ★★
  #   遷移（階段を降りた等）に気づいたときには、画面はもう次のマップです。
  #   だから「踏んだタイル」は**自動では撮れません**。
  #   その上に立っているうちに押してもらう形にしています。
  #
  # ⚠ 自動で「着いた先」を撮って「踏んだタイル」と名前を付けることは
  #   しません（別のものに正しそうな名前が付くのがいちばん困る）。
  tile_shot_dir: work/map-observations/stair_tiles

# --- キャラクター別戦術プロフィール（2026-07-30 / 仕様書 17章）--------------
#
# ★★ **AI が勝手に賢くなるのではなく、利用者が戦術を設計する。** ★★
#   > ユーザーが戦術を設計し、AIがその意図を再現可能な形で実行する。（仕様書 2.1）
#
# ★★ **ここ（config.yaml）の値は「全員共通の土台」。** ★★
#   プロフィールは、その上にキャラクターごとの値を重ねます。
#     auto_input.heal.threshold: 0.5   … 全員共通（これまでの値）
#     プロフィールの ally_hp_threshold: 60 … ムーンブルクだけ 60%
#
#   ⚠ **プロフィールを使わなければ、これまでとまったく同じ挙動**です。
#     `work/generated/tactics.lua` が無ければ config の値だけで動きます。
#
# ★いま効くのはフェーズ1・2の項目だけ（AI操作/役割/安全/回復/MP/道具）。
#   攻撃・補助・対象選択はフェーズ3以降です。画面では灰色になり、
#   ツールチップに「今後のフェーズで対応」と出ます。
#   ⚠ 未実装の項目は**AIへ渡していません**。渡すと、あとで実装したときに
#     設定していない値で急に効き始めます（仕様書 20章）。
#
# ★反映は**次の戦闘から**（仕様書 15.3）。戦闘の途中で入れ替わると、
#   同じターンの前半と後半が別の戦術で動き、その挙動は説明できません。
# ★★ ユーザー指定戦略（2026-08-11 / UI整理 Phase 4）★★
#
#   > ユーザーが指定したキャラクターごとの固定行動を使用する戦略（指示書§3.3）。
#
# ★DQ2 固有のデータはここ（プラグイン）に置く。Core には入れない（§13）。
# ⚠ 「ちからのたて」は**毎ターン固定**（依頼者の判断）。HP が満タンでも使う。
#   ★実行は Lua の `_claim_fixed_action`。ここはその「誰が何を」の表。
# ⚠ item は ROM のアイテムID（`memory_map.yaml` の items）。0x1D = ちからのたて。
# ⚠ item は ROM のアイテムID（`memory_map.yaml` の items）。0x1D = ちからのたて。
# ★fallback: 指定の道具が持ち物に無いときの代替行動（2026-08-11 / 依頼者）。
#   `defend` = ぼうぎょ（亀の子。盾を切らしても身を守る）。
user_strategies:
  custom_1:
    name: 亀の子戦術
    actors:
      lorasia:    { action: attack }
      samaltria:  { action: item, item: 0x1D, fallback: defend }
      moonbrooke: { action: item, item: 0x1D, fallback: defend }

tactics:
  enabled: true

  # プロフィールの置き場（1プロフィール1ファイル / 仕様書 10.1）
  dir: work/tactics/profiles

  # 起動時に同梱の見本をファイルとしても置くか。
  # ★手で編集したい人・Git で管理したい人のため。
  # ⚠ **既にあるファイルは上書きしません**（手で直したものを壊さない）。
  install_presets: true

# --- 地名（2026-07-30 / マッパー機能 全体仕様書 4章）------------------------
#
# ★★ **物理マップと論理ロケーションは別物** ★★
#   物理マップ  … ROM の map_id。1フロア = 1つ
#   ロケーション … 人が呼ぶ名前。「ローレシア」は 1F/2F/B1 の3マップ
#   → 表示は **ロケーション名 + 階層**（例: ローレシア B1）
#
# ★★ **名前は表示だけに使います。** ★★
#   自動移動が使うのは map_id と階層（どちらも ROM 由来）なので、
#   辞書が無くても、名前が間違っていても、経路の判断は壊れません。
#
# ⚠ 日本語名の大半は **ROM から取っていません**（ROM の会話辞書には
#   ローレシア / サマルトりア / ムーンブルク / ハーゴン / ロンダルキア の
#   5語だけ）。各項目の `name_source` を見てください。
#   間違っていたら `locations.yaml` を直せます（表示だけ変わります）。
locations:
  enabled: true

  # 3つの YAML の置き場。
  #   locations.yaml     … 論理ロケーション（名前・種別・確認できた階）
  #   map_bindings.yaml  … map_id -> ロケーション + 階層
  #   world_regions.yaml … ワールドマップの地域（⚠ 既定では空）
  # ★前2つは `python research/probes/archived/extract_map_names.py --write` で作り直せます。
  data_dir: retroux/plugins/dq2/data

# --- 移動知識ログ（2026-07-30 / 指示書 `input/移動知識ログ・経路記録仕様.md`）
#
# ★★ **保存するのは「どのキーを何回押したか」ではない。** ★★
#   「この道は通れる」「この方向は今のところ通れない」
#   「この階段は別のマップにつながる」という**再利用できる地図知識**。
#
# ★同じ情報は UPSERT で集約するので、同じ道を100回通っても**行は増えない**。
# ⚠ 毎フレームの座標履歴は保存しません（意味が変わり、肥大化するため）。
navigation:
  enabled: true

  # 入力してから何フレーム動かなければ「通れなかった」とみなすか。
  # ★1マス歩くのに十数フレームかかるので、それより余裕を持たせる。
  move_timeout_frames: 30

  # 何回失敗したら確度を provisional -> probable へ上げるか。
  # ⚠⚠ **失敗1回で壁と確定しない**（指示書 2.4）。同じ「動かなかった」に
  #   壁 / NPC / 扉 / イベント / 入力取りこぼし / 会話中 / メニュー中 が化ける。
  #   ★一度でも通れた方向は、何度失敗しても確度を上げません。
  blocked_probable_threshold: 3

  # 何回見たら遷移を confirmed にするか
  transition_confirmed_threshold: 2

  record_edges: true
  record_blocked: true
  record_transitions: true

  # 判定の途中まで出す詳細ログ（既定は切る。出すと行数が多い）
  debug_log: false
