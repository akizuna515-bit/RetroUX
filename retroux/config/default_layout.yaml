# 標準の画面レイアウト（2026-08-01 の指示書 §3・§4.1 / ★2026-08-18 改訂）。
#
# ★★ **このファイルは利用者が編集する対象ではありません。** ★★
#   動かした位置は `config/layout.yaml` に自動で保存されます。
#   並べ直したいときは画面の「標準レイアウトに戻す」を押してください。
#
# ★★ いまの標準は **4区画**（2026-08-09 / 依頼者の指示「案1でやる」）★★
#
#   ┌──────────┬──────────────┬──────────┐
#   │  地図    │    FCEUX     │  RetroUX │
#   │          │  （ゲーム）  │  状態    │
#   ├──────────┴──────────────┴──────────┤
#   │   ログ / 出会ったモンスター        │
#   └────────────────────────────────────┘
#
# ⚠ 入らない画面では**従来の2段配置へ落ちます**（`_compute_two_row`）。
#
# ## ⚠⚠ **どの値がどちらで使われるか**（2026-08-18 に整理）
#
#   ★ここを混ぜていたので、4区画では使われない値が残っていました。
#
#   | 値 | 4区画 | 従来の2段 |
#   | --- | --- | --- |
#   | `emulator.anchor` | ⚠ **使わない**（左右に挟むので中央固定） | ★使う |
#   | `map.width` / `main.width` | ⚠ **使わない**（左右の余りを半分ずつ） | ★使う |
#   | `map.height` / `main.height` | ⚠ **使わない**（下段を引いた残り全部） | ★使う |
#   | `spacing` | ★使う | ★使う |
#
# ## ⚠ `windows.log` は**わざと書いていません**
#
#   ★書くと、その値で頭打ちになり、**余りを使えなくなります**
#   （`retroux/core/layout.py` の `_compute_four_pane`）。
#   ⚠ `tests/test_layout_heights.py::test_同梱の設定は下段の高さを書かない`
#     が、足してしまったときに赤くします。
#
#   ★下段の高さは「余り、ただし `LOG_MAX_HEIGHT`（340px）まで」。
#     超えたぶんは地図と RetroUX の高さへ回ります。
#
# ## ★ 想定している画面（2026-08-18 / 依頼者の指示）
#
#   **1920x1080**（⚠ 1920x1200 からタスクバーを引いた大きさに相当）
#
#   そこでの実測:
#
#       地図    (8,8)    550x731
#       FCEUX   (568,8)  ★大きさは変えない（実寸 784x731）
#       RetroUX (1362,8) 550x731
#       ログ    (8,749)  1904x275   ← ★敵の札 約90px ＋ ログ 約12行
#
#   ⚠⚠ **アプリが見るのは論理画素です。**
#     ★1920x1200 を 150% 表示で使うと、作業領域は **1280x752** に見えます
#     （実測 / 2026-08-15）。そこでは下段は 219px になります。
#     ⚠ 物理解像度で設計すると、この差で必ず外します。
#
# ⚠⚠ **座標は固定値ではありません。** `anchor` の名前だけを書き、
#   実際の計算は `retroux/core/layout.py` が行います（指示書 §4.1）。
#   タスクバーの位置・DPI・モニタ構成・FCEUX の実寸で変わるためです。

schema_version: 1
layout_version: 1

# 設計の基準にした大きさ。★実際にはここへ合わせず、作業領域を実測して使う。
# 設計の基準にした大きさ。★実際にはここへ合わせず、作業領域を実測して使う。
# ⚠ **論理画素**です（★150% 表示なら 1280x800 に見えます）。
reference:
  width: 1920
  height: 1080

windows:
  emulator:
    visible: true
    # ★★ 横位置の寄せ方（2026-08-01 / 依頼者の環境に合わせて `top_left`）★★
    #
    #   | 値 | 向いている画面 |
    #   | --- | --- |
    #   | `top_left` | **横に広い画面**（3840px 等）。中央だと窓が右へ寄り、 |
    #   |            | 視線の移動が大きい。左上へ寄せるとひとかたまりになる |
    #   | `top_center` | 1920px 前後。左右の余りが少ないので中央が自然 |
    #
    #   ⚠ 下段（地図と RetroUX）も**同じ向きに寄る**。片方だけ中央にしない。
    #   ★縦は常に上端（指示書 §3.3）。
    anchor: top_left
    offset_x: 0
    # ⚠ 上端の余白は 0〜12px（指示書 §3.3）。0 だとタイトルバーが
    #   画面の縁に貼り付いて掴みにくいので、少しだけ空ける。
    offset_y: 8
    # ★大きさは指定しない（null）。FCEUX は指定を内部倍率で丸めるため、
    #   こちらが決めた数値と実際が食い違う。**実寸を読んで使う**。
    width: null
    height: null

  map:
    visible: true
    # FCEUX の下・左寄り（指示書 §3.4）
    anchor: below_emulator_left
    offset_x: 0
    offset_y: 10
    # ⚠⚠ **4区画では使いません**（★左右の余りを半分ずつ分けます）。
    #   ★従来の2段配置に落ちたときだけ効きます。
    #   ⚠ 地図は正方形か横長になりやすい。細い縦長サイドバーにしない（§3.4）
    width: 600
    height: 320

  main:
    visible: true
    # FCEUX の下・右寄り（指示書 §3.5）
    anchor: below_emulator_right
    offset_x: 0
    offset_y: 10
    # ⚠⚠ **4区画では使いません**（★上の `map` と同じ）
    width: 700
    height: 320

  lua_script:
    # ★★ 利用者向けの画面ではない（指示書 §9）★★
    #   ⚠ 閉じると Lua が止まるので**閉じません**。最小化で避けます。
    #   ★調査のために出したいときは「Lua Script ウィンドウを出す」で戻せます。
    visible: false
    behavior: minimize
    # ⚠ 最小化できなかったときの逃げ場所（画面の隅へ小さく）
    fallback:
      anchor: bottom_left
      width: 240
      height: 160

spacing:
  # ウィンドウどうしの隙間。★0 にすると窓枠の影が重なって掴みにくい。
  window_gap: 10
  # 画面の縁との余白
  screen_margin: 8

focus:
  # 通常プレイ中の操作のあと、ゲームへ操作を返すか（指示書 §10）
  restore_emulator_after_game_action: true
